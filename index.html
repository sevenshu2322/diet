<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="0KNAdq3WBO19BELXGa0xN8">
<head data-page-node-id="KNtnd0aQDYmbrtsJd92kqW">

<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="h6hge4EnoSUEmUdKrXlzX0">
<title>膳食管理 · 每日营养与缺口推荐</title>
<style>
/* ==========================================================================
   CSS 区（浅色主题）
   ========================================================================== */
:root{
  --bg:#f4f7f5;
  --card:#ffffff;
  --line:#e4ebe6;
  --line2:#eef3f0;
  --text:#1c2b25;
  --text2:#43584e;
  --muted:#7b9089;
  --brand:#12a06a;
  --brand-d:#0d8355;
  --brand-l:#e7f7ef;
  --p:#3b82f6;
  --p-l:#e8f1fe;
  --f:#e8951a;
  --f-l:#fdf3e2;
  --c:#8b5cf6;
  --c-l:#f1ebfe;
  --fb:#0f9d8f;
  --fb-l:#e2f6f3;
  --w:#2b9fe0;
  --w-l:#e4f2fc;
  --danger:#e0483a;
  --danger-l:#fdeceb;
  --radius:14px;
  --radius-s:10px;
  --shadow:0 1px 2px rgba(20,45,35,.04), 0 8px 24px rgba(20,45,35,.05);
  --shadow-s:0 1px 2px rgba(20,45,35,.05);
}
/* 深色主题：只覆盖变量，不动任何组件样式 */
html[data-theme="dark"]{
  --bg:#101614;
  --card:#18211d;
  --line:#26332d;
  --line2:#1e2925;
  --text:#e6efea;
  --text2:#a9bcb3;
  --muted:#7d918a;
  --brand:#2fbe83;
  --brand-d:#7ee0b0;
  --brand-l:#16352a;
  --p:#6aa8ff;
  --p-l:#16263c;
  --f:#f0ad4e;
  --f-l:#332a17;
  --c:#a78bfa;
  --c-l:#251f3a;
  --fb:#2dbdae;
  --fb-l:#123330;
  --w:#54b6ec;
  --w-l:#122c3a;
  --danger:#f0655a;
  --danger-l:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-s:0 1px 2px rgba(0,0,0,.3);
}
html[data-theme="dark"] input,
html[data-theme="dark"] select,
html[data-theme="dark"] textarea{
  background:#131c18;color:var(--text);border-color:var(--line);
}
html[data-theme="dark"] .modal-f{background:#16201c;}
/* 浅色下硬编码为白底的控件，深色里改用卡片底色 */
html[data-theme="dark"] .topbar{background:rgba(16,22,20,.9);}
html[data-theme="dark"] .btn.ghost{background:var(--line2);color:var(--text2);}
html[data-theme="dark"] .seg button{background:var(--line2);color:var(--text2);}
html[data-theme="dark"] .seg button.on{background:var(--brand-l);color:var(--brand-d);}
html[data-theme="dark"] .chip{background:var(--line2);color:var(--text2);}
html[data-theme="dark"] .chip.on{background:var(--brand-l);color:var(--brand-d);}
html[data-theme="dark"] .tab:hover{background:var(--line2);}
html[data-theme="dark"] input[type="search"],
html[data-theme="dark"] input[type="number"],
html[data-theme="dark"] input[type="text"]{background:#131c18;color:var(--text);}
html[data-theme="dark"] .cal-cell{background:var(--line2);}
html[data-theme="dark"] .cal-cell.lv3 .d,
html[data-theme="dark"] .cal-cell.lv3 .v{color:#08150f;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
h1,h2,h3,h4,p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
.hidden{display:none !important;}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  display:flex;align-items:center;gap:20px;
  height:58px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.3px;white-space:nowrap;}
.brand .logo{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#18b478,#0d8355);color:#fff;font-size:15px;line-height:1;
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}
#theme-sel{
  flex:none;width:auto;padding:6px 8px;font-size:12.5px;font-weight:600;
  color:var(--text2);background:var(--bg2);border:1px solid var(--line);border-radius:9px;cursor:pointer;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:600;white-space:nowrap;
  transition:background .15s,color .15s;
}
.tab:hover{background:var(--line2);color:var(--text2);}
.tab.active{background:var(--brand-l);color:var(--brand-d);}

/* ---------- 布局 ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 20px;}
main.wrap{padding-top:22px;padding-bottom:70px;}
.view{display:none;}
.view.active{display:block;}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-s);
}
.card+.card{margin-top:16px;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.card-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-t .sub{font-size:12px;font-weight:500;color:var(--muted);}
.sec-t{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;letter-spacing:.2px;}
/* 标题行：左标题 / 右操作（菜品页的排序控件挂在这里） */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 10px;flex-wrap:wrap;}
.sec-h .sec-t{margin-bottom:0;}
/* ---------- 排序下拉 ---------- */
.dish-sort{position:relative;flex:none;}
.dish-sort > .btn{white-space:nowrap;}
.dish-sort > .btn .caret{font-size:9px;opacity:.7;transition:transform .15s;}
.dish-sort.open > .btn{border-color:var(--brand);color:var(--brand-d);background:var(--brand-l);}
.dish-sort.open > .btn .caret{transform:rotate(180deg);}
.dish-sort-menu{
  position:absolute;right:0;top:calc(100% + 6px);z-index:70;min-width:186px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:5px;display:none;
}
.dish-sort.open .dish-sort-menu{display:block;}
.dish-sort-menu .hd{padding:5px 10px 6px;font-size:11px;font-weight:700;color:var(--muted);}
.dish-sort-menu .hd2{padding:2px 10px 7px;font-size:11px;font-weight:600;color:var(--muted);opacity:.85;}
.dish-sort-menu button{
  display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;
  padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);
  text-align:left;transition:background .12s,color .12s;
}
.dish-sort-menu button:hover{background:var(--line2);}
.dish-sort-menu button.on{background:var(--brand-l);color:var(--brand-d);}
.dish-sort-menu button .d{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;}
.dish-sort-menu button.on .d{color:var(--brand-d);}
.dish-sort-menu .sep{height:1px;background:var(--line);margin:5px 6px;}
.muted{color:var(--muted);}
.small{font-size:12px;}
.center{text-align:center;}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 15px;border-radius:9px;font-weight:600;
  background:var(--brand);color:#fff;transition:filter .15s,background .15s;
  border:1px solid transparent;
}
.btn:hover{filter:brightness(1.06);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--text2);}
.btn.ghost:hover{background:var(--line2);}
.btn.danger{background:var(--danger);}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px;}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;}
/* 删除二次确认 */
.cfm{display:flex;gap:12px;align-items:flex-start;}
.cfm-ico{flex:none;width:30px;height:30px;border-radius:50%;background:#fdecec;color:var(--danger);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
.cfm-tx{min-width:0;}
.cfm-t{font-weight:700;font-size:14.5px;margin-bottom:5px;}
.cfm-d{font-size:13px;color:var(--text2);line-height:1.65;}
.icon-btn{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);font-size:15px;line-height:1;transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--danger-l);color:var(--danger);}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:600;color:var(--text2);}
input[type=text],input[type=number],select,input[type=search]{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,160,106,.12);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{
  padding:6px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-weight:600;color:var(--text2);font-size:13px;transition:all .15s;
}
.seg button:hover{border-color:#c9d8d1;}
.seg button.on{background:var(--brand-l);border-color:#9fd9c0;color:var(--brand-d);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:600;color:var(--text2);transition:all .15s;
}
.chip:hover{border-color:#c9d8d1;}
.chip.on{background:var(--brand-l);border-color:#9fd9c0;color:var(--brand-d);}
.tagline{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--line2);color:var(--muted);}
.tag.hp{background:var(--p-l);color:#1d63d2;}
.tag.lf{background:var(--f-l);color:#b06f06;}
.tag.lc{background:var(--c-l);color:#6d3fd4;}

/* ---------- 进度条 ---------- */
.bar{height:9px;border-radius:999px;background:var(--line2);overflow:hidden;position:relative;}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .35s ease;}
.bar>i.over{background:var(--danger) !important;}
.bar-wrap{margin-bottom:11px;}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;}
.bar-name{font-weight:700;font-size:13px;}
.bar-val{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.bar-val b{color:var(--text);font-size:13.5px;font-weight:700;}
.bar-val .rest{color:var(--brand-d);font-weight:700;}
.bar-val .over-t{color:var(--danger);font-weight:700;}

/* ---------- 环形图 ---------- */
.ring-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.ring{position:relative;width:150px;height:150px;flex:0 0 auto;}
.ring svg{transform:rotate(-90deg);display:block;width:100%;height:100%;}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.ring-c .n{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;}
.ring-c .u{font-size:11.5px;color:var(--muted);font-weight:600;}
.ring-stat{display:flex;flex-direction:column;gap:9px;flex:1;min-width:190px;}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv span:first-child{color:var(--muted);}
.kv b{font-variant-numeric:tabular-nums;}

/* ---------- 记录列表 ---------- */
.meal{margin-bottom:16px;}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.meal-t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.meal-t .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);}
.meal-kcal{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.log-row{
  display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--radius-s);
  transition:background .15s;
}
.log-row:hover{background:var(--line2);}
.log-main{flex:1;min-width:0;}
.log-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.log-name .g{font-size:12px;color:var(--muted);font-weight:600;}
.log-macros{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px;}
.log-kcal{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.log-ings{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px;}

/* ---------- 通用行/列 ---------- */
.list-row{
  display:flex;align-items:center;gap:12px;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--radius-s);margin-bottom:7px;background:#fff;transition:border-color .15s,box-shadow .15s;
}
.list-row:hover{border-color:#c8dbd2;box-shadow:var(--shadow-s);}
.list-row .grow{flex:1;min-width:0;}
.list-row .t{font-weight:600;font-size:13.5px;}
.list-row .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.scroll{max-height:380px;overflow-y:auto;padding-right:4px;}
.scroll::-webkit-scrollbar{width:7px;}
.scroll::-webkit-scrollbar-thumb{background:#d5e2db;border-radius:99px;}
.scroll::-webkit-scrollbar-track{background:transparent;}

/* ---------- 菜谱卡 ---------- */
.rcp{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:#fff;margin-bottom:12px;transition:border-color .15s,box-shadow .15s;}
.rcp:hover{border-color:#c0d8ce;box-shadow:var(--shadow);}
.rcp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.rcp-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.score{
  font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;
  background:var(--brand-l);color:var(--brand-d);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.score.mid{background:var(--f-l);color:#b06f06;}
.score.low{background:var(--line2);color:var(--muted);}
.alpha{font-size:11.5px;color:var(--muted);font-weight:600;}
.ings{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.ing{
  display:inline-flex;align-items:baseline;gap:4px;padding:3px 9px;border-radius:8px;
  background:var(--line2);font-size:12.5px;
}
.ing b{font-weight:700;color:var(--brand-d);font-variant-numeric:tabular-nums;}
.rcp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed var(--line);}
.rcp-macros{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.rcp-macros b{font-weight:700;}
.b-p{color:var(--p);} .b-f{color:var(--f);} .b-c{color:var(--c);} .b-k{color:var(--brand-d);}
.b-fb{color:var(--fb);} .b-w{color:var(--w);}

/* ---------- 提示条 ---------- */
.note{
  display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-s);
  background:var(--brand-l);color:#0b6b46;font-size:13px;margin-bottom:14px;
}
.note.warn{background:var(--danger-l);color:#9b2c21;}
.note.info{background:var(--line2);color:var(--text2);}
.note .n-ico{font-size:15px;line-height:1.4;}

/* ---------- 模态框 ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(18,38,30,.42);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(2px);
}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,40,30,.22);overflow:hidden;
}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-h .mt{font-weight:700;font-size:15.5px;}
.modal-b{padding:18px 20px;overflow-y:auto;}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fbfdfc;}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:#1c2b25;color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  z-index:300;box-shadow:0 12px 30px rgba(15,40,30,.28);opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* ---------- 趋势图 ---------- */
.trend-box{overflow-x:auto;}
.trend-bars{display:flex;gap:10px;align-items:flex-end;min-height:130px;padding:6px 2px 0;}
.tb-col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.tb-bar{width:100%;max-width:44px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;position:relative;}
.tb-bar>i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--brand);opacity:.85;transition:height .4s;}
.tb-bar .tb-goal{position:absolute;left:-2px;right:-2px;border-top:2px dashed #9fb8ad;}
.tb-lb{font-size:11px;color:var(--muted);font-weight:600;}
.trend-bars.dense{gap:4px;}
.trend-bars.dense .tb-col{min-width:0;}
.trend-bars.dense .tb-lb{font-size:10px;min-height:14px;}
.trend-bars.dense .tb-vl{font-size:10px;min-height:14px;}
/* 记录日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;}
.cal-w{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px;}
.cal-cell{
  border:1px solid var(--line);border-radius:9px;min-height:48px;padding:5px 3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--bg2);cursor:pointer;transition:transform .12s,border-color .12s;
}
.cal-cell:hover{transform:translateY(-1px);border-color:var(--brand);}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default;}
.cal-cell.blank:hover{transform:none;}
.cal-cell .d{font-size:12.5px;font-weight:700;color:var(--text2);line-height:1.1;}
.cal-cell .v{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1;}
.cal-cell.lv1{background:var(--brand-l);}
.cal-cell.lv2{background:var(--brand-l);border-color:var(--brand);}
.cal-cell.lv3{background:var(--brand);border-color:var(--brand);}
.cal-cell.lv3 .d,.cal-cell.lv3 .v{color:#fff;}
.cal-cell.lv4{background:var(--danger-l);border-color:var(--danger);}
.cal-cell.today{outline:2px solid var(--brand-d);outline-offset:1px;}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px;}

/* 菜品页排序选项：[营养字段, 显示名, 默认方向]
   默认方向统一由高到低 —— 想先看「含量最高/最扎实」的那几道菜，
   反之点同一项即可翻成由低到高（方向随时可切，这里只定初次进入的默认档）。 */
const DISH_SORT_KEYS = [
  ["kcal",  "热量",     "desc"],
  ["p",     "蛋白质",   "desc"],
  ["f",     "脂肪",     "desc"],
  ["c",     "碳水",     "desc"],
  ["fiber", "膳食纤维", "desc"],
  ["water", "水分",     "desc"]
];

/* ---------- 2.2 数值 / 日期工具 ---------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function numOr(v, d){ const n = parseFloat(v); return (isNaN(n) || !isFinite(n)) ? d : n; }
function round1(v){ return Math.round(v * 10) / 10; }
/* 克数取整：<20g 取 1g 精度，≥20g 取 5g 精度，最低 3g */
function roundG(g){
  if(!(g > 0)) return 0;
  if(g < 20) return Math.max(3, Math.round(g));
  return Math.max(5, Math.round(g / 5) * 5);
}
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function keyToDate(k){ const p = String(k).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayKey(){ return dateKey(new Date()); }
function shiftKey(k, n){ const d = keyToDate(k); d.setDate(d.getDate() + n); return dateKey(d); }
const WEEK_CN = ["日","一","二","三","四","五","六"];
function keyLabel(k){
  const d = keyToDate(k);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 周" + WEEK_CN[d.getDay()];
}
function shortLabel(k){ const d = keyToDate(k); return (d.getMonth() + 1) + "/" + d.getDate(); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]
  ));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- 2.3 营养运算（含热量、三大宏量、膳食纤维、水分） ---------- */
function zeroMacro(){ return { kcal:0, p:0, f:0, c:0, fiber:0, water:0 }; }
function addMacro(a, b){
  return {
    kcal:a.kcal + b.kcal, p:a.p + b.p, f:a.f + b.f, c:a.c + b.c,
    fiber:(a.fiber || 0) + (b.fiber || 0), water:(a.water || 0) + (b.water || 0)
  };
}
function mulMacro(m, k){
  return {
    kcal:m.kcal * k, p:m.p * k, f:m.f * k, c:m.c * k,
    fiber:(m.fiber || 0) * k, water:(m.water || 0) * k
  };
}
/* 某种食材在指定克数下的营养贡献 */
function macroOf(food, grams){
  const k = grams / 100;
  return {
    kcal:(food.kcal || 0) * k, p:(food.p || 0) * k, f:(food.f || 0) * k, c:(food.c || 0) * k,
    fiber:(food.fiber || 0) * k, water:(food.water || 0) * k
  };
}
/* 菜谱基准份量下的营养向量 V */
function recipeVector(rcp){
  let m = zeroMacro();
  rcp.ings.forEach(it => {
    const f = FOOD_MAP[it.fid];
    if(f) m = addMacro(m, macroOf(f, it.g));
  });
  return m;
}
function recipeTotalGrams(rcp){ return rcp.ings.reduce((s, it) => s + it.g, 0); }

/* ---------- 食材搭配：由已选食材反查能做的菜 ----------
   葱姜蒜与油盐酱醋属于「家里常备」，不计入主料。
   否则「番茄 + 鸡蛋」会因为菜谱里还有大葱而匹配不到番茄炒蛋。 */
const PANTRY_IDS = ["garlic", "ginger", "scallion", "peanut_oil", "olive_oil", "sesame_oil"];
function isPantry(fid){
  if(PANTRY_IDS.indexOf(fid) >= 0) return true;
  const f = FOOD_MAP[fid];
  return !f || f.cat === "调味其他";
}
/* 菜谱的主料列表（排除常备调料） */
function mainIngs(rcp){
  return (rcp.ings || []).filter(x => !isPantry(x.fid));
}
/* 选中 ≥2 样主料的菜；exact = 主料都已在清单里 */
function pairDishes(selIds, limit){
  const S = {};
  (selIds || []).forEach(id => { S[id] = 1; });
  const out = [];
  RECIPES.forEach(rcp => {
    const M = mainIngs(rcp);
    const used = M.filter(x => S[x.fid]);
    if(used.length < 2) return;
    const miss = M.filter(x => !S[x.fid]);
    out.push({
      rcp: rcp, used: used.map(x => x.fid), miss: miss.map(x => x.fid),
      exact: miss.length === 0, nMain: M.length
    });
  });
  out.sort((a, b) =>
       (a.exact === b.exact ? 0 : (a.exact ? -1 : 1))
    || (b.used.length - a.used.length)
    || (a.miss.length - b.miss.length)
    || (a.rcp.name < b.rcp.name ? -1 : 1));
  return out.slice(0, limit || 8);
}
/* 只差一样主料就能做的菜（含只选了 1 样时的推荐） */
function nextStepDishes(selIds, limit){
  const S = {};
  (selIds || []).forEach(id => { S[id] = 1; });
  const out = [];
  RECIPES.forEach(rcp => {
    const M = mainIngs(rcp);
    if(M.length < 2) return;
    const used = M.filter(x => S[x.fid]);
    if(used.length !== M.length - 1) return;
    const miss = M.filter(x => !S[x.fid]);
    if(miss.length !== 1) return;
    out.push({ rcp: rcp, used: used.length, missFid: miss[0].fid, missG: miss[0].g });
  });
  out.sort((a, b) => (b.used - a.used) || (a.rcp.name < b.rcp.name ? -1 : 1));
  return out.slice(0, limit || 6);
}
/* 汇总记录 */
function sumLogs(entries){
  let m = zeroMacro();
  (entries || []).forEach(e => {
    m = addMacro(m, {
      kcal:e.kcal || 0, p:e.p || 0, f:e.f || 0, c:e.c || 0,
      fiber:e.fiber || 0, water:e.water || 0
    });
  });
  return m;
}
/* 剩余缺口（允许为负） */
function gapOf(target, consumed){
  const g = {};
  NUTRI_KEYS.forEach(k => { g[k] = (target[k] || 0) - (consumed[k] || 0); });
  return g;
}

/* ---------- 2.4 每日目标计算（依据国标 DRIs） ---------- */
/* Mifflin-St Jeor */
function calcBMR(pr){
  const base = 10 * pr.weight + 6.25 * pr.height - 5 * pr.age;
  return pr.sex === "male" ? base + 5 : base - 161;
}
/* 参考成年人的基础代谢，仅用于把国标水 AI 按体型折算 */
const BMR_REF = { male: calcBMR(REF_BODY.male), female: calcBMR(REF_BODY.female) };

/* 水分目标：国标 AI × 体型系数 + 活动补水
   —— AI 对应的是「轻身体活动水平（PAL 1.5）」的参考成年人，
      所以体型更大人更重、活动量更大的人需要更多水，低于参考水平则减少。 */
/* 活动量档位：把 PAL 值映射到 ACTIVITY 的最近一档（兼容档案里的自定义 / 旧数值） */
function actIndex(pal){
  let best = 0, bd = Infinity;
  for(let i = 0; i < ACTIVITY.length; i++){
    const d = Math.abs(ACTIVITY[i][0] - Number(pal));
    if(d < bd){ bd = d; best = i; }
  }
  return best;
}
/* 计算蛋白质该用哪个体重：BMI ≥ 28 时换成「调整体重」，避免高估肥胖者的需求 */
function proteinRefWeight(pr){
  const kg = Math.max(0, Number(pr.weight) || 0);
  const m  = Math.max(0.5, Number(pr.height) || 170) / 100;
  const bmi = kg / (m * m);
  const ideal = DRI.healthyBMI * m * m;
  if(!(kg > 0) || bmi < DRI.obesityBMI || kg <= ideal){
    return { kg: kg, adjusted: false, bmi: bmi, ideal: Math.round(ideal * 10) / 10 };
  }
  const adj = ideal + 0.4 * (kg - ideal);
  return { kg: adj, adjusted: true, bmi: bmi, ideal: Math.round(ideal * 10) / 10 };
}
/* 蛋白质该怎么算：先看「每周练几次」定档 → 在档位区间内按目标取位 → 乘以参考体重 */
function calcProteinTarget(pr, kcal){
  const sex  = pr.sex === "female" ? "female" : "male";
  const ai   = actIndex(pr.activity);
  const band = DRI.proteinPerKgByAct[ai];
  const at   = DRI.proteinPickAtGoal[pr.goal] != null ? DRI.proteinPickAtGoal[pr.goal] : 0.55;
  const RW   = proteinRefWeight(pr);
  const want = band.lo + (band.hi - band.lo) * at;         /* 期望的 g/kg */
  let p = want * RW.kg;

  const amdrHi = DRI.proteinAMDRHiByAct[ai];
  let hi = Infinity, capped = false;
  if(kcal > 0){
    const lo  = kcal * DRI.proteinAMDR[0] / KCAL_PER_G.p;   /* AMDR 下限 10% */
    hi = kcal * amdrHi / KCAL_PER_G.p;
    p = clamp(p, lo, hi);
    /* RNI 是硬指标，尽量保住；但若热量本身太低（久坐 + 大幅减脂），仍受供能比上限约束 */
    p = Math.max(p, Math.min(DRI.proteinRNI[sex], hi));
    if(want * RW.kg > hi + 0.5) capped = true;
  }
  const realKg = Math.max(0, Number(pr.weight) || 0);
  return {
    p: p, perKgWant: want, perKg: realKg > 0 ? p / realKg : 0,
    band: band, actIndex: ai, actLabel: ACTIVITY[ai][1],
    amdrHi: amdrHi, capped: capped,
    refWeight: RW, refPerKg: RW.kg > 0 ? p / RW.kg : 0
  };
}
/* 目标中文名 */
function goalCN(g){
  for(let i = 0; i < GOALS.length; i++) if(GOALS[i][0] === g) return GOALS[i][1];
  return "维持";
}
/* 给用户的蛋白质来源说明（直接拼进「我的目标」页的浅色小字） */
function proteinNoteHTML(P, p, kg, pr){
  const RW = P.refWeight;
  let s = '按「' + esc(P.actLabel) + '」这一档取 <b>' + round1(P.perKgWant) + ' g/kg</b>'
        + '（该档位推荐 ' + P.band.lo + '～' + P.band.hi + ' g/kg）';
  if(RW && RW.adjusted){
    s += '；BMI ' + round1(RW.bmi) + ' 属于肥胖范围，按<b>调整体重 ' + round1(RW.kg)
       + ' kg</b>计（理想体重 ' + RW.ideal + ' kg + 40% 超出部分），'
       + '直接按实际体重 ' + kg + ' kg 算会明显高估';
  }else{
    s += ' × ' + kg + ' kg';
  }
  const wantG = P.perKgWant * RW.kg;
  if(P.capped){
    s += ' 约 ' + Math.round(wantG) + ' g；受适用于该活动量的供能比上限 '
       + Math.round(P.amdrHi * 100) + '% 约束，调整为 <b>' + round1(p) + ' g</b>'
       + '（合 ' + round1(P.perKg) + ' g/kg 实际体重）';
  }else{
    s += ' → <b>' + round1(p) + ' g</b>（合 ' + round1(P.perKg) + ' g/kg 实际体重）';
  }
  return s;
}
function calcWaterTarget(pr, bmr, tdee){
  const sex = pr.sex === "female" ? "female" : "male";
  const shape = clamp(bmr / BMR_REF[sex], WATER_SHAPE_RANGE[0], WATER_SHAPE_RANGE[1]);
  const base  = DRI.waterAI[sex] * shape;
  const refTdee = bmr * WATER_REF_PAL;
  const actKcal = clamp(tdee - refTdee, WATER_ACT_ADJ[0] / WATER_ML_PER_KCAL,
                                      WATER_ACT_ADJ[1] / WATER_ML_PER_KCAL);
  const actAdj  = actKcal * WATER_ML_PER_KCAL;
  const total   = Math.max(1000, Math.round((base + actAdj) / 50) * 50);
  return { total, base:Math.round(base), shape, actAdj:Math.round(actAdj),
           refTdee, actKcal, aiValue:DRI.waterAI[sex] };
}
/* 整日食物水估算：
   · 基准按「整日目标热量 × 系数」估算（混合膳食约 0.5 mL/kcal），
     这样还没开始记录时也能算出合理的「建议饮水量」；
   · 若当天已记录的食物水更高（吃了西瓜、汤这类高含水食物），则采用实际值；
   · 记录不完整时不会低估食物水，避免把建议饮水算得虚高。 */
function estimateFoodWater(planKcal, foodWaterLogged, hasFoodLogs){
  const est = Math.max(0, (planKcal || 0) * FOOD_WATER_PER_KCAL);
  if(!hasFoodLogs) return est;
  return Math.max(est, Math.max(0, foodWaterLogged || 0));
}
/* 建议饮水量 = 总水目标 − 食物水（DRI 的总水 AI 已包含食物水与代谢水） */
function drinkSuggest(waterTarget, foodWaterEst){
  return Math.max(0, Math.round((waterTarget - foodWaterEst) / 10) * 10);
}
/* 自动目标：
   1) 热量：TDEE × 目标系数（减脂 0.80 / 维持 1.00 / 增肌 1.10）
   2) 蛋白质：先按「每周运动频率」定档（g/kg 体重，五档拉开），再在档位区间内
      按目标取位（减脂偏高保肌肉 / 维持取中位 / 增肌取更高），乘以「参考体重」；
      参考体重在 BMI ≥ 28 时用调整体重（理想体重 + 40% 超出部分），避免高估肥胖者的需求。
      最后夹进供能比区间：下限国标 10%，上限按活动量放宽（久坐 20% → 极高 28%），
      并尽量保住国标 RNI（男 65 / 女 55 g）不被下调。
   3) 脂肪：默认取国标 20%～30% 的中位 25%；双向给碳水让路——
      碳水会低于 50% 时把脂肪压到 20% 以上腾位，高于 65% 时把脂肪抬到 30% 以下压回来。
   4) 碳水：扣除蛋白质、脂肪后的热量余量 ÷ 4，结果稳定落在国标 50%～65% 内
   5) 膳食纤维：国标 AI 25 g
   6) 水分：国标总水 AI 为基准，按体型与活动量动态增减（见 calcWaterTarget）
   ------------------------------------------------------------------------- */
function calcAutoTarget(pr){
  const bmr  = calcBMR(pr);
  const tdee = bmr * pr.activity;
  const goalK = GOAL_KCAL[pr.goal] != null ? GOAL_KCAL[pr.goal] : 1;
  const kcal = tdee * goalK;

  const sex = pr.sex === "female" ? "female" : "male";

  /* --- 1. 蛋白质：按「每周运动频率」分档 → 区间内按目标取位 → 乘以体重 --- */
  const P = calcProteinTarget(pr, kcal);
  const p = P.p;
  const pRatio = kcal > 0 ? p * KCAL_PER_G.p / kcal : 0;

  /* --- 2. 脂肪供能比：默认 25%；两边都为碳水让路 ---
     碳水必须留在国标 50%～65% 内：
       · 蛋白占比高时（高训练量 / 减脂）→ 脂肪压到 20% 以上给碳水腾位
       · 蛋白占比很低时 → 脂肪抬到 30% 以下把碳水压回 65% */
  let fRatio = FAT_TARGET_RATIO;
  if(kcal > 0){
    const cIdeal = 1 - pRatio - fRatio;
    if(cIdeal < DRI.carbAMDR[0]){
      fRatio = clamp(1 - pRatio - DRI.carbAMDR[0], DRI.fatAMDR[0], FAT_TARGET_RATIO);
    }else if(cIdeal > DRI.carbAMDR[1]){
      fRatio = clamp(1 - pRatio - DRI.carbAMDR[1], FAT_TARGET_RATIO, DRI.fatAMDR[1]);
    }
  }
  const f = kcal * fRatio / KCAL_PER_G.f;

  /* --- 3. 碳水：热量余量，天然落在国标 AMDR 区间 --- */
  const c = Math.max(0, (kcal - p * KCAL_PER_G.p - f * KCAL_PER_G.f) / KCAL_PER_G.c);

  /* --- 4/5/6. 膳食纤维与水分 --- */
  const fiber = DRI.fiberAI;
  const W = calcWaterTarget(pr, bmr, tdee);
  const water = W.total;

  const fRatioReal = kcal > 0 ? f * KCAL_PER_G.f / kcal : 0;
  const cRatio = kcal > 0 ? c * KCAL_PER_G.c / kcal : 0;

  return {
    bmr, tdee, kcal, p, f, c, fiber, water,
    pRatio, fRatio:fRatioReal, cRatio,
    /* 蛋白质来源说明：让用户能核对「这条数字是按什么规则算出来的」 */
    protein: P,
    waterBase: W.base, waterActAdj: W.actAdj, waterShape: W.shape,
    waterRefTdee: W.refTdee, waterActKcal: W.actKcal,
    waterAI: W.aiValue, drinkAI: DRI.drinkAI[sex],
    ratios: { p:pRatio, f:fRatioReal, c:cRatio },
    amdr:   { p:DRI.proteinAMDR, f:DRI.fatAMDR, c:DRI.carbAMDR },
    proteinNote: proteinNoteHTML(P, p, pr.weight)
  };
}
/* 手动覆盖优先级高于自动值；覆盖键与 NUTRI_KEYS 一一对应 */
function calcTarget(pr){
  const auto = calcAutoTarget(pr);
  const ov = pr.override || {};
  const has = k => ov[k] != null && ov[k] !== "" && isFinite(ov[k]);
  const pick = k => has(k) ? +ov[k] : auto[k];
  const overridden = {};
  NUTRI_KEYS.forEach(k => { overridden[k] = has(k); });
  return {
    kcal: pick("kcal"), p: pick("p"), f: pick("f"), c: pick("c"),
    fiber: pick("fiber"), water: pick("water"),
    auto: auto,
    overridden: overridden
  };
}

/* ---------- 2.5 菜谱缩放引擎 ----------
   对缺口为正的营养素做「相对误差」加权最小二乘，闭式解：
       α* = Σ(Gi² / Vi) / Σ(Gi)        i ∈ { p, f, c | Gi > 0 }
   等价于以 w_i = Gi / ΣGj 为权的加权平均 Σ w_i·(Gi / Vi)：
   缺口越大的营养素越主导缩放。
   α* < lo 视为「该菜谱离需求太远」，直接剔除（避免只剩半份的方案）；
   α* > hi 则截断到 hi（避免出现离谱份量）。
   ------------------------------------------------------------------------- */
function solveAlpha(V, G, lo, hi){
  let numer = 0, denom = 0;
  MACRO_KEYS.forEach(k => {
    if(G[k] > 0.0001 && V[k] > 0.0001){ numer += G[k] * G[k] / V[k]; denom += G[k]; }
  });
  if(denom <= 0) return null;
  const raw = numer / denom;
  if(raw < lo) return null;
  return { raw, a: clamp(raw, lo, hi) };
}
/* 评分：
   match = 1 − 归一化残差
   over  = 已超标营养素被继续超发 + 正缺口营养素超发 >30%（都做归一化）
   dev   = |α − 1| / 1.5（越接近基准份量越自然）
   score = 100 × (0.55·match − 0.30·over − 0.15·dev)
   ------------------------------------------------------------------------- */
function scoreRecipe(V, G, a){
  const R = mulMacro(V, a);
  const pos = [], neg = [];
  MACRO_KEYS.forEach(k => { (G[k] > 0 ? pos : neg).push(k); });

  let match = 1;
  if(pos.length){
    let e = 0;
    pos.forEach(k => { e += Math.abs(G[k] - R[k]) / Math.max(G[k], 1); });
    match = 1 - Math.min(e / pos.length, 1);
  }
  let over = 0;
  neg.forEach(k => { const g = Math.abs(G[k]); over += R[k] / (g + R[k]); });
  pos.forEach(k => { const r = R[k] / G[k]; if(r > 1.3) over += (r - 1.3) * 0.5; });
  if(G.kcal > 0 && R.kcal > G.kcal * 1.3) over += Math.min((R.kcal / G.kcal - 1.3) * 0.25, 0.3);

  const overN = Math.min(over, 1);
  const dev   = Math.abs(a - 1) / 1.5;
  return { R, match, over: overN, dev, score: 100 * (0.55 * match - 0.30 * overN - 0.15 * dev) };
}
/* 覆盖缺口百分比（只统计还欠缺的营养素） */
function coveragePct(G, R){
  const ks = MACRO_KEYS.filter(k => G[k] > 0);
  if(!ks.length) return null;
  return ks.reduce((s, k) => s + clamp(R[k] / G[k], 0, 1.5), 0) / ks.length;
}
/* 推荐主函数。G 为剩余缺口；返回按 score 降序的方案数组 */
function recommendRecipes(G, opts){
  const o = Object.assign({ lo:0.5, hi:2.5, limit:10 }, opts || {});
  const positive = MACRO_KEYS.reduce((s, k) => s + Math.max(G[k], 0), 0);
  if(positive <= 0) return [];
  const out = [];
  RECIPES.forEach(rcp => {
    const V = recipeVector(rcp);
    if(V.p <= 0 && V.f <= 0 && V.c <= 0) return;
    const sol = solveAlpha(V, G, o.lo, o.hi);
    if(!sol) return;
    const sc = scoreRecipe(V, G, sol.a);
    out.push({
      rcp, alpha: sol.a, rawAlpha: sol.raw, V, R: sc.R,
      score: sc.score, match: sc.match, over: sc.over,
      grams: sol.a * recipeTotalGrams(rcp),
      cover: coveragePct(G, sc.R),
      ings: rcp.ings
        .map(it => ({ food: FOOD_MAP[it.fid], g: roundG(it.g * sol.a) }))
        .filter(x => x.food && x.g > 0)
    });
  });
  out.sort((x, y) => y.score - x.score);
  return out.slice(0, o.limit);
}
/* 按单个菜谱构造方案（不做 α 剔除，供搜索兜底使用） */
function buildPlan(rcp, G, lo, hi){
  const V = recipeVector(rcp);
  if(V.p <= 0 && V.f <= 0 && V.c <= 0) return null;
  let a = 1, raw = 1;
  const sol = solveAlpha(V, G, lo == null ? 0.05 : lo, hi == null ? 4 : hi);
  if(sol){ a = sol.a; raw = sol.raw; }
  const sc = scoreRecipe(V, G, a);
  return {
    rcp, alpha: a, rawAlpha: raw, V, R: sc.R,
    score: sc.score, match: sc.match, over: sc.over,
    grams: a * recipeTotalGrams(rcp),
    cover: coveragePct(G, sc.R),
    ings: rcp.ings
      .map(it => ({ food: FOOD_MAP[it.fid], g: roundG(it.g * a) }))
      .filter(x => x.food && x.g > 0)
  };
}
/* 关键词是否命中这道菜：菜名 / 分类 / 标签 / 食材名 */
function matchRecipeText(rcp, kw){
  if(!kw) return true;
  if(rcp.name.toLowerCase().indexOf(kw) >= 0) return true;
  if(String(rcp.cat || "").toLowerCase().indexOf(kw) >= 0) return true;
  if((rcp.tags || []).some(t => t.toLowerCase().indexOf(kw) >= 0)) return true;
  return rcp.ings.some(it => {
    const f = FOOD_MAP[it.fid];
    return f && f.name.toLowerCase().indexOf(kw) >= 0;
  });
}
/* 菜品搜索：命中后仍按「当前缺口」缩放份量，所以搜索结果可以直接加入今日。
   与 recommendRecipes 的区别：不做 α 范围剔除，搜什么就能看到什么；
   排序按「菜名命中优先 → 匹配度」，避免搜「番茄」时把番茄味的汤排在最前面。 */
function searchRecipes(q, G, opts){
  const o = Object.assign({ limit: 1000 }, opts || {});
  const kw = String(q || "").trim().toLowerCase();
  const out = [];
  RECIPES.forEach(rcp => {
    if(!matchRecipeText(rcp, kw)) return;
    const p = buildPlan(rcp, G, 0.5, 2.5);
    if(!p) return;
    const nm = rcp.name.toLowerCase();
    p.rank = (nm === kw) ? 0 : (nm.indexOf(kw) === 0 ? 1 : (nm.indexOf(kw) >= 0 ? 2 : 3));
    out.push(p);
  });
  out.sort((x, y) => (x.rank - y.rank) || (y.score - x.score) || (x.rcp.name < y.rcp.name ? -1 : 1));
  return out.slice(0, o.limit);
}

/* ---------- 菜品排序 ----------
   排序对象是「已经按缺口缩放好的方案」，用的是 R（缩放后的实际营养），
   与卡片上显示的数字完全一致 —— 否则会出现「按热量排序」但列表看起来没按热量排。 */
function sortValueOf(plan, key){
  const R = (plan && plan.R) ? plan.R : {};
  const v = Number(R[key]);
  return isFinite(v) ? v : 0;
}
function dishSortDef(key){
  for(let i = 0; i < DISH_SORT_KEYS.length; i++){
    if(DISH_SORT_KEYS[i][0] === key) return DISH_SORT_KEYS[i];
  }
  return null;
}
/* 选某个字段时用的初始方向（当前六个字段统一由高到低，见 DISH_SORT_KEYS） */
function defaultDishSort(key){
  const d = dishSortDef(key);
  return d ? { key:d[0], dir:d[2] } : null;
}
/* 排序：sort 为 null 时保持入参顺序（推荐列表本来就是按匹配度排好的）。
   同值时回退到匹配度、再回退到菜名，保证顺序稳定可复现。 */
function sortPlans(list, sort){
  const arr = (list || []).slice();
  if(!sort || !sort.key) return arr;
  const dir = sort.dir === "asc" ? 1 : -1;
  arr.sort((a, b) => {
    const d = (sortValueOf(a, sort.key) - sortValueOf(b, sort.key)) * dir;
    if(Math.abs(d) > 1e-6) return d;
    const s = (b.score || 0) - (a.score || 0);
    if(Math.abs(s) > 1e-9) return s;
    const an = (a.rcp && a.rcp.name) || "", bn = (b.rcp && b.rcp.name) || "";
    return an < bn ? -1 : (an > bn ? 1 : 0);
  });
  return arr;
}
function dishSortLabel(sort){
  if(!sort || !sort.key) return "匹配度";
  const d = dishSortDef(sort.key);
  if(!d) return "匹配度";
  return d[1] + (sort.dir === "asc" ? " ↑" : " ↓");
}

/* ---------- 2.6 自由搭配：贪心补足算法 ----------
   1. 容差判定：热量 ±50kcal 且三大宏量各 ±3g、膳食纤维 ±5g → 认为已均衡
   2. 找最短板：相对缺口比例最大的营养素 i*（含膳食纤维；水分不计入，喝水即可）
   3. 候选筛选（关键，避免给出荒谬建议）：
      a. 不推荐「调味其他」类（酱油、糖、油、饮料、零食）作为补足食材
      b. 按分类限制单次建议克数，避免「补 60g 脂肪 → 喝 60g 油」
      c. 极浓缩食材（蛋白粉、奶粉、芝麻酱等）单独设更小的上限
      d. 单个食材补充的热量不超过「剩余热量」与「每日热量 35%」中的较小值；
         若剩余热量已不足 60 kcal，放宽到 120 kcal 以内（允许少量高蛋白补足）
   4. 候选打分：score = 营养素密度 / (1 + risk)，risk 含热量代价与「推爆其他营养素」风险
   5. 建议克数：g = clamp(缺口 / 密度, 10, 分类上限)，再按 5g / 1g 取整
   ------------------------------------------------------------------------- */
const GREEDY_EXCLUDE_CATS = { "调味其他":1 };
/* 参与「找最短板」的营养素：三大宏量 + 膳食纤维 */
const GREEDY_KEYS = ["p","f","c","fiber"];
const GREEDY_CAT_MAX_G = {
  "坚果油脂":40, "蔬菜":300, "水果":300, "谷物主食":250,
  "肉禽":200, "水产":200, "蛋奶":250, "豆制品":200
};
const GREEDY_FOOD_MAX_G = {
  whey_protein:40, milk_powder:40, sesame_paste:30, peanut_butter:40, condensed_milk:30,
  cheese_cheddar:60, cocoa_powder:20, dark_chocolate:40, nori_dry:15, shrimp_dried:20,
  douchi:30, chia_seed:20, flax_seed:20, sesame_black:20, cream:40, butter:20, lard:20,
  wood_ear_dry:50, white_fungus_dry:50, shiitake_dry:40
};
function greedyMaxG(fd){
  let cap = GREEDY_FOOD_MAX_G[fd.id];
  if(cap == null) cap = GREEDY_CAT_MAX_G[fd.cat] != null ? GREEDY_CAT_MAX_G[fd.cat] : 200;
  if(fd.cat === "坚果油脂" && /油$/.test(fd.name)) cap = Math.min(cap, 20);
  return cap;
}
function greedySuggest(basketMacro, target, consumed, opts){
  const o = Object.assign({ limit:3, lam:0.004, mu:0.15 }, opts || {});
  const total = addMacro(consumed, basketMacro);
  const G = gapOf(target, total);

  if(Math.abs(G.kcal) <= 50 && Math.abs(G.p) <= 3 && Math.abs(G.f) <= 3
     && Math.abs(G.c) <= 3 && Math.abs(G.fiber) <= 5){
    return { balanced:true, gap:G, tips:[] };
  }
  const rel = {};
  GREEDY_KEYS.forEach(k => { rel[k] = G[k] / Math.max(target[k] || 0, 1); });
  let key = "p";
  GREEDY_KEYS.forEach(k => { if(rel[k] > rel[key]) key = k; });
  if(rel[key] <= 0){
    /* 三大宏量全部超标 → 反向提示（膳食纤维超标无害，不计入） */
    let worst = "f";
    MACRO_KEYS.forEach(k => { if(G[k] < G[worst]) worst = k; });
    return { balanced:false, allOver:true, gap:G, key:worst, need:G[worst], tips:[] };
  }
  const need = G[key];
  const kcalCap = G.kcal > 60 ? Math.min(G.kcal, target.kcal * 0.35) : 120;
  const cands = [];
  FOODS.forEach(fd => {
    if(GREEDY_EXCLUDE_CATS[fd.cat]) return;
    const density = (fd[key] || 0) / 100;
    if(density <= 0.01) return;
    const catMax = greedyMaxG(fd);
    let g = need / density;
    if(fd.kcal > 0) g = Math.min(g, kcalCap / (fd.kcal / 100));
    /* 避免把其他「还欠缺」的宏量一次性推爆：按最紧的约束收缩份量（留 15% 弹性）
       膳食纤维超标无害，不参与收缩 */
    let gAdj = g;
    MACRO_KEYS.forEach(k => {
      if(k === key) return;
      const dk = (fd[k] || 0) / 100;
      if(dk > 0 && G[k] > 0){
        const gLimit = (G[k] * 1.15 + 2) / dk;
        if(gLimit < gAdj) gAdj = gLimit;
      }
    });
    g = roundG(clamp(gAdj, 10, catMax));
    if(!(g > 0)) return;
    const add = macroOf(fd, g);

    let risk = (fd.kcal / 100) * o.lam;
    MACRO_KEYS.forEach(k => {
      if(k === key) return;
      if(G[k] <= 0) risk += Math.max(0, fd[k] / 100) * o.mu;
    });
    MACRO_KEYS.forEach(k => {
      if(k === key) return;
      const after = G[k] - add[k];
      if(G[k] > 0 && after < -3) risk += Math.min(Math.abs(after) / 50, 0.5);
      if(G[k] <= 0)             risk += Math.min(add[k] / 30, 0.5);
    });
    cands.push({ food:fd, g:g, add:add, key:key, need_of:add[key],
                 score: density / (1 + risk), risk: risk });
  });
  cands.sort((a, b) => b.score - a.score);
  /* 优先覆盖不同大类，避免一次全推同一种食材 */
  const tips = [], usedCat = {};
  for(let i = 0; i < cands.length && tips.length < o.limit; i++){
    if(usedCat[cands[i].food.cat]) continue;
    usedCat[cands[i].food.cat] = 1;
    tips.push(cands[i]);
  }
  for(let i = 0; i < cands.length && tips.length < o.limit; i++){
    if(tips.indexOf(cands[i]) < 0) tips.push(cands[i]);
  }
  return { balanced:false, allOver:false, gap:G, key, need, kcalCap, tips };
}

/* 把一整份菜谱方案转成可写入记录的条目；k 为缩放系数（1 = 按推荐克数） */
function planToEntry(plan, meal, k){
  k = (typeof k === "number" && isFinite(k) && k > 0) ? k : 1;
  const items = plan.ings.map(x => ({ name:x.food.name, g: Math.max(1, Math.round(x.g * k)) }));
  return {
    id: uid(), meal: meal, src:"recipe", refId: plan.rcp.id,
    label: plan.rcp.name, grams: items.reduce((s, x) => s + x.g, 0), items: items,
    kcal: round1(plan.R.kcal * k), p: round1(plan.R.p * k), f: round1(plan.R.f * k), c: round1(plan.R.c * k),
    fiber: round1((plan.R.fiber || 0) * k), water: round1((plan.R.water || 0) * k),
    ts: Date.now()
  };
}
function foodToEntry(food, grams, meal){
  const m = macroOf(food, grams);
  return {
    id: uid(), meal: meal, src:"food", refId: food.id,
    label: food.name, grams: grams, items: null,
    kcal: round1(m.kcal), p: round1(m.p), f: round1(m.f), c: round1(m.c),
    fiber: round1(m.fiber), water: round1(m.water),
    ts: Date.now()
  };
}
/* 饮水记录：只贡献水分（1mL ≈ 1g） */
function waterToEntry(ml, meal){
  return {
    id: uid(), meal: meal || "drink", src:"water", refId:null,
    label: "饮水", grams: ml, items: null,
    kcal:0, p:0, f:0, c:0, fiber:0, water: ml,
    ts: Date.now()
  };
}
/* 家常单位：从「1 个约 50g」这类提示里解析出每单位克数（纯函数，便于单测） */
function parseUnits(hint){
  const out = [];
  const re = /(\d+(?:\.\d+)?)\s*([^\s\d约]+)\s*约\s*(\d+(?:\.\d+)?)\s*g/g;
  let m;
  const s = String(hint || "");
  while((m = re.exec(s))){
    const per = Number(m[3]) / Number(m[1]);
    if(isFinite(per) && per > 0) out.push({ unit:m[2], g: Math.round(per * 10) / 10 });
  }
  return out;
}

function sanitizeLogEntry(e){

/* mode: "merge" 合并（跳过重复 id）| "replace" 覆盖 */
function applyBackup(obj, mode){
  if(!obj || typeof obj !== "object") return { ok:false, msg:"文件内容不是有效的备份" };
  if(obj.app && obj.app !== "diet") return { ok:false, msg:"这不是本站导出的备份文件" };
  const replace = mode === "replace";
  let nLog = 0;

  /* 覆盖模式：先清掉本站已有的按日记录，避免备份里没有的旧日期残留 */
  if(replace){
    const dead = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(K.LOG) === 0) dead.push(k);
    }
    dead.forEach(k => LS.del(k));
  }

  const logs = (obj.logs && typeof obj.logs === "object") ? obj.logs : {};
  Object.keys(logs).forEach(d => {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    const arr = (Array.isArray(logs[d]) ? logs[d] : []).map(sanitizeLogEntry).filter(Boolean);
    if(!arr.length) return;
    if(replace){
      LS.set(K.LOG + d, arr);
    }else{
      const cur = LS.get(K.LOG + d, []) || [];
      const seen = {}; cur.forEach(e => { if(e && e.id) seen[e.id] = 1; });
      LS.set(K.LOG + d, cur.concat(arr.filter(e => !seen[e.id])));
    }
    nLog += arr.length;
  });
  if(state.logs !== undefined) state.logs = loadLogs(state.date);

  if(obj.profile && typeof obj.profile === "object" && (replace || !state.profile)){
    state.profile = Object.assign(defaultProfile(), obj.profile);
    state.profile.override = Object.assign(
      { kcal:null, p:null, f:null, c:null, fiber:null, water:null }, obj.profile.override || {});
    saveProfile();
  }
  if(replace || (Array.isArray(obj.customFoods) && !state.customFoods.length)){
    state.customFoods = Array.isArray(obj.customFoods)
      ? obj.customFoods.filter(f => f && f.id && f.name) : [];
    saveCustom();
  }
  if(replace || Array.isArray(obj.customRecipes)){
    const src = Array.isArray(obj.customRecipes) ? obj.customRecipes : [];
    const inc = src.filter(r => r && r.id && r.name && Array.isArray(r.ings) && r.ings.length);
    state.customRecipes = replace ? inc
      : state.customRecipes.concat(inc.filter(r => !state.customRecipes.some(x => x.id === r.id)));
  }
  if(replace || (obj.weights && typeof obj.weights === "object")){
    const w = replace ? {} : Object.assign({}, state.weights);
    const srcW = (obj.weights && typeof obj.weights === "object") ? obj.weights : {};
    Object.keys(srcW).forEach(d => {
      const v = Number(srcW[d]);
      if(/^\d{4}-\d{2}-\d{2}$/.test(d) && isFinite(v) && v > 0) w[d] = Math.round(v * 10) / 10;
    });
    state.weights = w; saveWeights();
  }
  if(replace || Array.isArray(obj.templates)){
    const srcT = Array.isArray(obj.templates) ? obj.templates : [];
    const inc = srcT.filter(t => t && t.id && t.name && Array.isArray(t.items) && t.items.length);
    state.templates = replace ? inc
      : state.templates.concat(inc.filter(t => !state.templates.some(x => x.id === t.id)));
    saveTemplates();
  }
  registerCustomFoods(state.customFoods);
  registerCustomRecipes();
  const nR = state.customRecipes.length, nT = state.templates.length;
  const nW = Object.keys(state.weights).length;
  return { ok:true, msg:"导入成功：" + nLog + " 条记录、" + nW + " 条体重、"
    + nR + " 个自定义菜谱、" + nT + " 个套餐" };
}

/* 把自定义食材注册进全局食材表（先清掉上一批，避免重复） */
function registerCustomFoods(list){
  for(let i = FOODS.length - 1; i >= 0; i--){
    if(FOODS[i].custom){ delete FOOD_MAP[FOODS[i].id]; FOODS.splice(i, 1); }
  }
  (list || []).forEach(f => {
    f.custom = true;
    /* 自定义食材未填水分 / 纤维时按 0 处理，避免参与计算时出现 NaN */
    if(!isFinite(f.water)) f.water = 0;
    if(!isFinite(f.fiber)) f.fiber = 0;
    FOODS.push(f); FOOD_MAP[f.id] = f;
  });
}

/* 展示用数值：水分按 mL 取整（小数毫升没有意义），其余保留 1 位小数 */
function disp(key, v){ return key === "water" ? Math.round(v) : round1(v); }
function macroBarHTML(key, consumed, target, overridden){
  const cls = { p:"p-p", f:"p-f", c:"p-c", kcal:"p-k", fiber:"p-fb", water:"p-w" }[key];
  const barCls = { p:"var(--p)", f:"var(--f)", c:"var(--c)", kcal:"var(--brand)", fiber:"var(--fb)", water:"var(--w)" }[key];
  const pct = target > 0 ? clamp(consumed / target * 100, 0, 999) : 0;

            : ' · <span class="rest">还差 ' + disp(key, Math.max(rest,0)) + ' ' + unit + '</span>')

function ringHTML(consumed, target){
  const R = 62, C = 2 * Math.PI * R;
  const ratio = target > 0 ? consumed / target : 0;
  const frac  = clamp(ratio, 0, 1);
  const color = ratio > 1.05 ? "var(--danger)" : "var(--brand)";
  const rest  = target - consumed;
  return ''
  + '<div class="ring">'
  +   '<svg width="150" height="150" viewBox="0 0 150 150">'
  +     '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="#eef3f0" stroke-width="13"></circle>'
  +     '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="13"'
  +       ' stroke-linecap="round" stroke-dasharray="' + (C * frac).toFixed(1) + ' ' + C.toFixed(1) + '"></circle>'
  +   '</svg>'
  +   '<div class="ring-c"><div class="n">' + Math.round(consumed) + '</div><div class="u">/ ' + Math.round(target) + ' kcal</div></div>'
  + '</div>'
  + '<div class="ring-stat">'
  +   '<div class="kv"><span>目标热量</span><b>' + Math.round(target) + ' kcal</b></div>'
  +   '<div class="kv"><span>已摄入</span><b>' + Math.round(consumed) + ' kcal</b></div>'
  +   '<div class="kv"><span>' + (rest >= 0 ? '还可摄入' : '已超出') + '</span><b style="color:' + (rest >= 0 ? "var(--brand-d)" : "var(--danger)") + '">'
  +     Math.round(Math.abs(rest)) + ' kcal</b></div>'
  +   '<div class="kv"><span>完成度</span><b>' + Math.round(ratio * 100) + '%</b></div>'
  + '</div>';
}
function gapChipsHTML(G){

}

function weightSeries(n, end){
  const base = end || todayKey();
  const out = [];
  for(let i = n - 1; i >= 0; i--){
    const k = shiftKey(base, -i);
    out.push({ k: k, v: (state.weights[k] != null) ? state.weights[k] : 0 });
  }
  return out;
}
function weightLastBefore(k){
  const keys = Object.keys(state.weights).filter(x => x < k && state.weights[x] != null).sort();
  return keys.length ? { k: keys[keys.length - 1], v: state.weights[keys[keys.length - 1]] } : null;
}
function weightSparkHTML(series, name){
  const vs = series.map(d => d.v).filter(v => v > 0);
  if(!vs.length) return '';
  const lo = Math.min.apply(null, vs) - 0.6;
  const hi = Math.max.apply(null, vs) + 0.6;
  const span = Math.max(hi - lo, 1);
  const cols = series.map(d => {
    const hp = d.v > 0 ? clamp((d.v - lo) / span * 100, 6, 100) : 0;
    return '<div class="tb-col">'
      + '<div class="tb-vl">' + (d.v > 0 ? d.v.toFixed(1) : "–") + '</div>'
      + '<div class="tb-bar"><i style="height:' + hp + '%;background:var(--p)"></i></div>'
      + '<div class="tb-lb">' + shortLabel(d.k) + '</div></div>';
  }).join("");
  return '<div style="margin-top:12px">'
    + '<div class="bar-top"><span class="bar-name">' + (name || "体重变化") + '</span>'
    + '<span class="bar-val">' + vs.length + ' 次记录 · 最低 <b>' + Math.min.apply(null, vs).toFixed(1)
    + '</b> kg · 最高 <b>' + Math.max.apply(null, vs).toFixed(1) + '</b> kg</span></div>'
    + '<div class="trend-bars">' + cols + '</div></div>';
}

/* ---------- 5.2 菜品（推荐 + 搜索） ---------- */
/* 当前缺口上下文：供推荐列表与搜索共用（缺口的算法只在这里算一次） */
function recoContext(){
  const T = currentTarget();
  const consumed = sumLogs(state.logs);
  const G = gapOf(T, consumed);
  const pos = MACRO_KEYS.reduce((s, k) => s + Math.max(G[k], 0), 0);
  if(pos > 0) state.recoBalanced = false;   /* 缺口重新出现时，自动退出「忽略缺口」模式 */
  const ignoreGap = (pos <= 0) && state.recoBalanced;
  /* 忽略缺口时，按「一顿正餐 = 每日目标的 1/3」来给方案 */
  const gapUse = ignoreGap ? { kcal:T.kcal / 3, p:T.p / 3, f:T.f / 3, c:T.c / 3 } : G;
  state._recoGap = gapUse;
  return { T: T, consumed: consumed, G: G, pos: pos, ignoreGap: ignoreGap, gapUse: gapUse };
}
/* 菜品列表（推荐方案 / 搜索结果二选一）——抽成函数以便搜索时局部刷新，不丢输入焦点 */
/* 标题行 + 排序控件：标题在左，排序下拉在右（同一行，窄屏自动换行） */
function dishSortBarHTML(titleText){
  const s = state.dishSort;
  const on = !!(s && s.key);
  const items = DISH_SORT_KEYS.map(x => {
    const cur = on && s.key === x[0];
    return '<button class="' + (cur ? "on" : "") + '" data-action="dish-sort-pick" data-k="' + x[0] + '">'
      + '<span>' + esc(x[1]) + '</span>'
      + '<span class="d">' + (cur ? (s.dir === "asc" ? "↑ 由低到高" : "↓ 由高到低") : "") + '</span>'
      + '</button>';
  }).join("");
  return '<div class="sec-h">'
    + '<div class="sec-t">' + titleText + '</div>'
    + '<div class="dish-sort' + (state.dishSortOpen ? " open" : "") + '">'
    +   '<button class="btn ghost sm" data-action="dish-sort-toggle"'
    +     ' aria-haspopup="true" aria-expanded="' + (state.dishSortOpen ? "true" : "false") + '"'
    +     ' title="按营养含量排序">排序：' + esc(dishSortLabel(s)) + ' <span class="caret">▼</span></button>'
    +   '<div class="dish-sort-menu" role="menu">'
    +     '<div class="hd">按营养含量排序</div>'
    +     '<div class="hd2">数值为当前缺口缩放后的份量 · 默认由高到低</div>'
    +     items
    +     '<div class="sep"></div>'
    +     '<button class="' + (on ? "" : "on") + '" data-action="dish-sort-clear">'
    +       '<span>匹配度（默认）</span><span class="d">' + (on ? "" : "✓") + '</span></button>'
    +   '</div>'
    + '</div></div>';
}
function recoDishListHTML(ctx){
  const out = [];
  const kw = String(state.dishQuery || "").trim();

  if(kw){
    let hits = searchRecipes(kw, ctx.gapUse);
    out.push(dishSortBarHTML('搜索结果 · 「' + esc(kw) + '」共 ' + hits.length + ' 道'
      + '（份量已按当前缺口缩放）'));
    hits = sortPlans(hits, state.dishSort);
    if(!hits.length){
      out.push('<div class="card"><div class="empty">没搜到「' + esc(kw) + '」相关的菜品。'
        + '可以换个关键词，比如食材名（鸡胸 / 番茄 / 粉丝）、分类（汤 / 凉拌 / 早餐）或口味（快手 / 高蛋白）。</div></div>');
    }else{
      hits.forEach(p => out.push(recipeCardHTML(p)));
    }
    return out.join("");
  }

  let lo = 0.5, hi = 2.5, relaxed = false;
  let list = recommendRecipes(ctx.gapUse, { lo:lo, hi:hi, limit:10 });
  if(!list.length){
    lo = 0.4; hi = 3.0; relaxed = true;
    list = recommendRecipes(ctx.gapUse, { lo:lo, hi:hi, limit:10 });
  }
  state._recoLo = lo;
  state._recoHi = hi;
  const sorted = sortPlans(list, state.dishSort);

  if(ctx.ignoreGap){
    out.push(noteHTML("info", "i", "已忽略缺口，下面按「一顿正餐约为每日目标的 1/3」为你推荐，可自行增减份量。"));
  }else{
    if(ctx.G.kcal > 0 && ctx.G.kcal < 100){
      out.push(noteHTML("info", "i", "剩余热量不足 100 kcal，份量已压到最低，实际吃的时候可以再减半。"));
    }
    if(relaxed){
      out.push(noteHTML("info", "i", "没有份量完全匹配的菜谱，已放宽份量范围（0.4 ~ 3.0 倍）重新挑选。"));
    }
  }

  if(!list.length){
    out.push('<div class="card"><div class="empty">暂时没有合适的菜谱，'
      + '可能是份量需求过小或某类营养素已经明显超标。可以到「自由搭配」自己组合食材，'
      + '或者用上面的搜索栏直接找想吃的菜。</div></div>');
  }else{
    const s = state.dishSort;
    const d = s && s.key ? dishSortDef(s.key) : null;
    out.push(dishSortBarHTML('推荐方案 · ' + (d
      ? '按 ' + esc(d[1]) + ' ' + (s.dir === "asc" ? "由低到高" : "由高到低") + '排序'
      : '按匹配度排序')
      + '（共 ' + list.length + ' 道，份量已按你的缺口等比缩放）'));
    sorted.forEach(p => out.push(recipeCardHTML(p)));
  }
  return out.join("");
}

/* ---------- 5.3 自由搭配 ---------- */
function filteredFoods(){
  const kw = state.diyQuery.trim().toLowerCase();
  return FOODS.filter(f => {
    if(state.diyCat !== "全部" && f.cat !== state.diyCat) return false;
    if(!kw) return true;
    return f.name.toLowerCase().indexOf(kw) >= 0 || f.id.indexOf(kw) >= 0;
  });
}
function refreshDiyFoodList(){
  const box = document.getElementById("diy-food-list");
  if(box){
    const list = filteredFoods();
    box.innerHTML = list.length ? list.map(foodRowHTML).join("") : '<div class="empty">没有匹配的食材</div>';
  }
  const c = document.getElementById("diy-count");
  if(c) c.textContent = state.diyCat + ' · 共 ' + filteredFoods().length + ' 种';
}

  const consumed = sumLogs(state.logs);
  let basketMacro = zeroMacro();
  state.basket.forEach(it => { basketMacro = addMacro(basketMacro, macroOf(it.food, it.g)); });
  const totalWith = addMacro(consumed, basketMacro);
  const G2 = gapOf(T, totalWith);
  const sug = greedySuggest(basketMacro, T, consumed);
  const out = [];

  out.push('<div class="grid2">');

  /* 左：食材库 */
  const list = filteredFoods();
  out.push('<div class="card">'

    + '</div>'

    + (list.length ? list.map(foodRowHTML).join("") : '<div class="empty">没有匹配的食材</div>')
    + '</div></div>');

  /* 右：篮子 */
  out.push('<div class="card">'
    + '<div class="card-h"><div class="card-t">本餐搭配 <span class="sub">' + state.basket.length + ' 种食材</span></div>'
    + (state.basket.length ? '<button class="btn ghost sm" data-action="ask-basket-clear">清空</button>' : '')
    + '</div>');

  if(!state.basket.length){
    out.push('<div class="empty">从左边点选食材，这里会实时显示这餐的营养，以及还缺什么。</div>');
    out.push(diyDishMatchHTML());
  }else{
    out.push(state.basket.map((it, i) => basketRowHTML(it, i)).join(""));
    out.push(diyDishMatchHTML());
    out.push('<div class="stat-box" style="margin:12px 0 16px">'
      + '<div class="stat-grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'
      +   statMini("这餐热量", Math.round(basketMacro.kcal), "kcal", "p-k")
      +   statMini("这餐蛋白质", round1(basketMacro.p), "g", "p-p")
      +   statMini("这餐脂肪", round1(basketMacro.f), "g", "p-f")
      +   statMini("这餐碳水", round1(basketMacro.c), "g", "p-c")
      +   statMini("这餐膳食纤维", round1(basketMacro.fiber), "g", "p-fb")
      +   statMini("这餐水分", Math.round(basketMacro.water), "mL", "p-w")
      + '</div></div>');

    out.push('<div class="sec-t">加上这餐后的全天进度</div>');
    out.push(NUTRI_META.filter(x => x[0] !== "kcal").map(x =>
      macroBarHTML(x[0], totalWith[x[0]], T[x[0]], T.overridden[x[0]])).join(""));

    const warns = [];
    NUTRI_META.filter(x => x[0] !== "fiber" && x[0] !== "water").forEach(x => {
      if(G2[x[0]] < -0.5) warns.push(x[1] + '超出 ' + round1(-G2[x[0]]) + ' ' + KEY_UNIT[x[0]]);

/* ---------- 5.4 趋势 ---------- */
function sparkHTML(title, series, goal, color, unit, dense){
  const vals = series.map(d => d.v);
  const max = Math.max(goal > 0 ? goal : 0, ...vals, 1);
  const avg = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
  const rnd = unit === "mL" ? Math.round : round1;
  const n = series.length;
  const cols = series.map((d, i) => {
    const hp = d.v > 0 ? clamp(d.v / max * 100, 2, 100) : 0;
    const gp = goal > 0 ? clamp(goal / max * 100, 0, 100) : 0;
    /* 30 天时只保留每 5 天一个刻度、不显示柱顶数值，避免挤成一团 */
    const lb = dense ? ((i % 5 === 0 || i === n - 1) ? shortLabel(d.k) : '') : shortLabel(d.k);
    const vl = (d.v > 0 && !dense) ? String(rnd(d.v)) : (d.v > 0 ? '' : '–');
    return '<div class="tb-col" title="' + shortLabel(d.k) + '：' + rnd(d.v) + ' ' + unit + '">'
      + '<div class="tb-vl">' + vl + '</div>'
      + '<div class="tb-bar"><i style="height:' + hp + '%;background:' + color + '"></i>'
      + (goal > 0 ? '<span class="tb-goal" style="bottom:' + gp + '%"></span>' : '')
      + '</div>'
      + '<div class="tb-lb">' + lb + '</div></div>';
  }).join("");
  return '<div style="margin-bottom:20px">'
    + '<div class="bar-top"><span class="bar-name">' + title + '</span>'
    + '<span class="bar-val">' + n + ' 日平均 <b>' + rnd(avg) + '</b> ' + unit
    + ' · 目标 ' + Math.round(goal) + ' ' + unit + '</span></div>'
    + '<div class="trend-bars' + (dense ? ' dense' : '') + '">' + cols + '</div></div>';
}
/* ---------- 记录日历 ---------- */
function calMonthKey(k){ return String(k).slice(0, 7); }
function calShiftMonth(mk, delta){
  const p = String(mk).split("-");
  const d = new Date(+p[0], +p[1] - 1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}
function calLevel(kcal, goal){
  if(!(kcal > 0)) return 0;
  const r = goal > 0 ? kcal / goal : 0;
  if(r > 1.1) return 4;
  if(r >= 0.8) return 3;
  if(r >= 0.5) return 2;
  return 1;
}
function calendarHTML(){
  const T = currentTarget();
  const mk = state.calMonth || calMonthKey(todayKey());
  const p = String(mk).split("-");
  const y = +p[0], mo = +p[1];
  const first = new Date(y, mo - 1, 1);
  const lead = (first.getDay() + 6) % 7;              /* 周一为一周起点 */
  const total = new Date(y, mo, 0).getDate();
  const cells = [];
  for(let i = 0; i < lead; i++) cells.push(null);
  for(let d = 1; d <= total; d++){
    const k = y + "-" + pad2(mo) + "-" + pad2(d);
    const arr = (k === state.date) ? state.logs : LS.get(K.LOG + k, []);
    cells.push({ k: k, m: sumLogs(arr || []) });
  }
  while(cells.length % 7) cells.push(null);

  const wk = ["一","二","三","四","五","六","日"];
  const out = [];
  out.push('<div class="card"><div class="card-h"><div class="card-t">记录日历 <span class="sub">'
    + y + ' 年 ' + mo + ' 月</span></div>'
    + '<div class="row-btns">'
    +   '<button class="btn ghost sm" data-action="cal-month" data-v="prev">← 上月</button>'
    +   '<button class="btn ghost sm" data-action="cal-month" data-v="this">本月</button>'
    +   '<button class="btn ghost sm" data-action="cal-month" data-v="next">下月 →</button>'
    + '</div></div>');
  out.push('<div class="cal-grid">' + wk.map(w => '<div class="cal-w">' + w + '</div>').join("") + '</div>');
  out.push('<div class="cal-grid">' + cells.map(c => {
    if(!c) return '<div class="cal-cell blank"></div>';
    const lv = calLevel(c.m.kcal, T.kcal);
    const cls = 'cal-cell' + (lv ? ' lv' + lv : '') + (c.k === state.date ? ' today' : '');
    const future = c.k > todayKey();
    return '<button class="' + cls + '" data-action="day-goto" data-date="' + c.k + '"'
      + ' title="' + keyLabel(c.k) + (c.m.kcal > 0 ? '：' + Math.round(c.m.kcal) + ' kcal' : '：无记录') + '">'
      + '<span class="d">' + (+c.k.slice(8)) + '</span>'
      + '<span class="v">' + (c.m.kcal > 0 ? Math.round(c.m.kcal) : (future ? '' : '–')) + '</span>'
      + '</button>';
  }).join("") + '</div>');
  out.push('<div class="cal-legend">'
    + '<span><i style="background:var(--bg2)"></i>无记录</span>'
    + '<span><i style="background:var(--brand-l)"></i>不足一半</span>'
    + '<span><i style="background:var(--brand-l);border-color:var(--brand)"></i>接近目标</span>'
    + '<span><i style="background:var(--brand);border-color:var(--brand)"></i>达标（80%～110%）</span>'
    + '<span><i style="background:var(--danger-l);border-color:var(--danger)"></i>超出 110%</span>'
    + '<span>点任意一天可跳到那天的记录</span></div>');
  out.push('</div>');
  return out.join("");
}
function renderTrend(){

  out.push(sparkHTML("蛋白质", data.map(d => ({ k:d.k, v:d.m.p })), T.p, "var(--p)", "g", dense));
  out.push(sparkHTML("脂肪",   data.map(d => ({ k:d.k, v:d.m.f })), T.f, "var(--f)", "g", dense));
  out.push(sparkHTML("碳水",   data.map(d => ({ k:d.k, v:d.m.c })), T.c, "var(--c)", "g", dense));
  out.push(sparkHTML("膳食纤维", data.map(d => ({ k:d.k, v:d.m.fiber })), T.fiber, "var(--fb)", "g", dense));
  out.push(sparkHTML("水分",   data.map(d => ({ k:d.k, v:d.m.water })), T.water, "var(--w)", "mL", dense));
  out.push('<div class="legend">'
    + '<span><i style="background:var(--brand)"></i>热量</span>'
    + '<span><i style="background:var(--p)"></i>蛋白质</span>'
    + '<span><i style="background:var(--f)"></i>脂肪</span>'
    + '<span><i style="background:var(--c)"></i>碳水</span>'
    + '<span><i style="background:var(--fb)"></i>膳食纤维</span>'
    + '<span><i style="background:var(--w)"></i>水分</span>'
    + '<span>虚线 = 当前每日目标</span></div>');
  out.push('</div></div>');

  /* 摄入 vs 目标 的差值表 */
  out.push('<div class="card"><div class="card-h"><div class="card-t">差值一览 <span class="sub">摄入 − 目标</span></div></div>');
  out.push('<div class="scroll" style="max-height:none">');
  NUTRI_META.forEach(x => {
    const k = x[0];
    const vals = data.map(d => d.m[k] - T[k]);
    const nz = vals.filter(v => Math.abs(v) > 0.5).length;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    out.push('<div class="kv"><span>' + x[1] + '</span><b style="color:'
      + (avg > 0 ? "var(--danger)" : "var(--brand-d)") + '">'
      + (avg > 0 ? '平均超出 ' : '平均缺口 ') + disp(k, Math.abs(avg)) + ' ' + x[2]
      + '<span class="muted" style="font-weight:600"> · ' + nz + '/' + n + ' 天有记录</span></b></div>');
  });
  out.push('</div></div>');

  /* 体重曲线 */
  const wSeries = weightSeries(n);
  if(wSeries.some(d => d.v > 0)){
    out.push('<div class="card"><div class="card-h"><div class="card-t">体重变化 <span class="sub">最近 '
      + n + ' 天</span></div></div>' + weightSparkHTML(wSeries) + '</div>');
  }

  /* 记录日历 */
  out.push(calendarHTML());

  if(logged === 0){
    out.push(noteHTML("info", "i", "还没有任何记录。到「今日」页开始记录，这里就会自动生成趋势。"));
  }
  document.getElementById("view-trend").innerHTML = out.join("");
}

/* 供能比对照条：轨道 0～70%，绿色区间 = 国标 AMDR，黑针 = 实际值 */
function amdrBarHTML(pct, lo, hi){
  const SCALE = 70;
  const bp = clamp(lo / SCALE * 100, 0, 100);
  const bw = clamp((hi - lo) / SCALE * 100, 0, 100);
  const pp = clamp(pct / SCALE * 100, 0, 100);
  return '<div class="amdr-bar">'
    + '<span class="band" style="left:' + bp + '%;width:' + bw + '%"></span>'
    + '<span class="pin" style="left:calc(' + pp + '% - 1.5px)"></span>'
    + '</div>';
}
function amdrRowHTML(label, ratio, range, cls, rangeLabel){

  return '<div class="amdr-row">'
    + '<span class="nm">' + label + '</span>'
    + '<span class="val ' + cls + '">' + round1(pct) + '%</span>'
    + '<span class="rng">' + (rangeLabel || "国标") + ' ' + lo + '%～' + hi + '%</span>'
    + '<span class="amdr-flag ' + (ok ? 'ok' : 'warn') + '">' + (ok ? '达标' : '偏离') + '</span>'
    + '</div>' + amdrBarHTML(pct, lo, hi);

function openModal(title, bodyHTML, footHTML, headExtra, cancelText){
  document.getElementById("modal-box").innerHTML =
      '<div class="modal-h"><div class="mt">' + title + '</div>'
    + '<div style="display:flex;align-items:center;gap:9px">' + (headExtra || '')
    + '<button class="icon-btn" data-action="modal-close" title="关闭">×</button></div></div>'
    + '<div class="modal-b">' + bodyHTML + '</div>'
    + '<div class="modal-f">' + (footHTML || '') + '<button class="btn ghost" data-action="modal-close">'
    + (cancelText || '关闭') + '</button></div>';
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
  state._planModal = null;
  state._confirm = null;
}
/* ---------- 统一的删除二次确认 ----------
   askConfirm 只负责问；确认后由 confirm-yes 把原动作按原参数派发回去，
   所以各删除逻辑仍然只有一处实现，不会出现「确认按钮里再写一遍删除代码」。 */
function askConfirm(cfg){
  state._confirm = { action: cfg.action, data: cfg.data || {} };
  const body = '<div class="cfm">'
    + '<div class="cfm-ico">!</div>'
    + '<div class="cfm-tx"><div class="cfm-t">' + (cfg.title || '确认删除') + '</div>'
    +   '<div class="cfm-d">' + (cfg.msg || '') + '</div></div>'
    + '</div>'
    + (cfg.extra || '');
  openModal('确认删除', body,
    '<button class="btn danger" data-action="confirm-yes">' + (cfg.btn || '确认删除') + '</button>',
    '', '取消');
}
function recModalList(q){
  const kw = String(q || "").trim().toLowerCase();
  const list = FOODS.filter(f => !kw
    || f.name.toLowerCase().indexOf(kw) >= 0
    || f.id.indexOf(kw) >= 0
    || f.cat.indexOf(kw) >= 0);
  if(!list.length) return '<div class="empty">没找到匹配的食材</div>';
  return list.slice(0, 120).map(f =>
    '<div class="list-row"><div class="grow"><div class="t">' + esc(f.name) + '</div>'
    + '<div class="s">每100g：' + per100(f)
    + (f.hint ? ' · ' + esc(f.hint) : '') + '</div></div>'
    + '<input type="number" min="1" step="5" placeholder="数量" data-role="rec-g" data-fid="' + f.id + '" style="width:74px;padding:5px 8px">'
    + unitSelectHTML(f, "rec-unit")
    + '<button class="btn xs" data-action="rec-add" data-fid="' + f.id + '">记录</button></div>'
  ).join("");
}

    + '<div class="field" style="margin-bottom:12px"><label>菜谱名称</label>'

          .map(c => '<option value="' + c + '"' + (c === d.cat ? ' selected' : '') + '>' + c + '</option>').join("")
    +   '</select></div>'
    + '<div class="field" style="margin-bottom:12px"><label>做法备注（可留空）</label>'
    +   '<input type="text" data-role="rc-note" placeholder="例如：牛腩先焯水，小火炖 1 小时" value="' + esc(d.note) + '"></div>'

    +   Math.round(kcal) + ' kcal）</div>'
    + (d.ings.length
        ? d.ings.map((x, i) => '<div class="list-row"><div class="grow"><div class="t">'
            + esc(FOOD_MAP[x.fid] ? FOOD_MAP[x.fid].name : x.fid) + '</div>'
            + '<div class="s">' + Math.round(macroOf(FOOD_MAP[x.fid] || {kcal:0,p:0,f:0,c:0,fiber:0,water:0}, x.g).kcal)
            + ' kcal</div></div>'
            + '<input type="number" min="1" step="5" value="' + x.g + '" data-role="rcp-ing-g" data-i="' + i + '" style="width:74px;padding:5px 8px">'
            + '<span class="small muted">g</span>'
            + '<button class="icon-btn" data-action="rcp-ing-del" data-i="' + i + '" title="移除">×</button></div>').join("")

    + '<input type="search" data-role="rcp-ing-search" placeholder="搜索食材，如 牛腩 / 番茄 / 米饭" value="'

/* ---------- 复制上一餐 / 昨天 ---------- */
function copyEntriesTo(entries, meal){
  entries.forEach(e => {
    state.logs.push(Object.assign({}, e, {
      id: uid(), meal: meal || e.meal, ts: Date.now()
    }));
  });
  saveLogs();
}
function openCopyModal(){
  const dates = allLogDates().filter(d => d !== state.date).slice(-8).reverse();
  if(!dates.length){
    openModal("复制记录", '<div class="empty">还没有其它日期的记录可以复制。</div>', '');
    return;
  }
  const body = '<div class="small muted" style="margin-bottom:10px">把某一天的记录整餐复制到 '
    + keyLabel(state.date) + '。复制的是当时的营养数值，之后仍然可以单独删除。</div>'
    + dates.map(d => {
        const arr = LS.get(K.LOG + d, []) || [];
        if(!arr.length) return '';
        const total = Math.round(sumLogs(arr).kcal);
        const byMeal = MEALS.map(m => {
          const sub = arr.filter(e => e.meal === m[0]);
          if(!sub.length) return '';
          return '<div class="list-row"><div class="grow"><div class="t">' + m[1]
            + ' <span class="sub">' + sub.length + ' 条 · ' + Math.round(sumLogs(sub).kcal) + ' kcal</span></div></div>'
            + '<button class="btn xs" data-action="copy-meal" data-date="' + d + '" data-meal="' + m[0] + '">复制这一餐</button></div>';
        }).join("");
        return '<div class="sec-t">' + keyLabel(d) + ' · ' + arr.length + ' 条 · ' + total + ' kcal</div>'
          + byMeal
          + '<div class="row-btns" style="margin:6px 0 14px">'
          +   '<button class="btn ghost sm" data-action="copy-day" data-date="' + d + '">复制整天</button>'
          + '</div>';
      }).join("");
  openModal("复制已有记录", body || '<div class="empty">没有可复制的记录。</div>', '');
}
