function planPreviewHTML(plan, k){
  const R = plan.R;
  return '<div class="rcp-macros" style="margin-bottom:12px">'
    + '<span>热量 <b class="b-k">' + Math.round(R.kcal * k) + '</b> kcal</span>'
    + '<span>蛋白 <b class="b-p">' + round1(R.p * k) + '</b> g</span>'
    + '<span>脂肪 <b class="b-f">' + round1(R.f * k) + '</b> g</span>'
    + '<span>碳水 <b class="b-c">' + round1(R.c * k) + '</b> g</span>'
    + '<span>纤维 <b class="b-fb">' + round1((R.fiber || 0) * k) + '</b> g</span>'
    + '<span>水分 <b class="b-w">' + Math.round((R.water || 0) * k) + '</b> mL</span>'
    + '</div>'
    + '<div class="small muted" style="margin-bottom:7px">各食材克数同步按比例换算：</div>'
    + '<div class="ings">' + plan.ings.map(x =>
        '<span class="ing">' + esc(x.food.name) + ' <b>' + Math.max(1, Math.round(x.g * k)) + 'g</b></span>').join("") + '</div>';
}
function planPreviewUpdate(){
  const pm = state._planModal;
  if(!pm) return;
  const input = document.querySelector('[data-role="plan-g"]');
  const box = document.getElementById("plan-preview");
  if(!box) return;
  const g = numOr(input ? input.value : "", 0);
  if(!(g > 0) || !(pm.plan.grams > 0)){
    box.innerHTML = '<div class="small muted">请填写大于 0 的克数</div>';
    return;
  }
  box.innerHTML = planPreviewHTML(pm.plan, g / pm.plan.grams);
}
function openPlanModal(plan, meal, keepG){
  state._planModal = { plan: plan, meal: meal || defaultMeal() };
  const reco = Math.max(1, Math.round(plan.grams));
  const g0 = Math.max(1, Math.round(numOr(keepG, reco)));
  const m = state._planModal.meal;
  const body = ''
    + '<div class="field" style="margin-bottom:15px"><label>记到哪一餐</label>'
    +   '<div class="seg" id="plan-meals">' + MEALS.map(x =>
          '<button class="' + (x[0] === m ? "on" : "") + '" data-action="pick-plan-meal" data-v="' + x[0] + '">'
          + x[1] + '</button>').join("") + '</div></div>'
    + '<div class="field" style="margin-bottom:8px"><label>整份总克数（营养按比例换算）</label>'
    +   '<div style="display:flex;align-items:center;gap:9px">'
    +     '<input type="number" min="1" step="5" value="' + g0 + '" data-role="plan-g" style="width:110px">'
    +     '<span class="small muted">g · 推荐 ' + reco + 'g</span>'
    +   '</div></div>'
    + '<div id="plan-preview" style="margin-top:12px">' + planPreviewHTML(plan, plan.grams > 0 ? g0 / plan.grams : 1) + '</div>';
  openModal('加入今日 · ' + esc(plan.rcp.name), body,
    '<button class="btn" data-action="plan-confirm">确认加入</button>',
    '<button class="btn ghost sm" data-action="plan-use-reco">按照推荐添加</button>');
}
function openCustomModal(){
  const body = '<div class="small muted" style="margin-bottom:14px">照着包装上的「营养成分表」填写每 100g 的数值即可；'
    + '膳食纤维与水分没写的话留空，按 0 计。</div>'
    + '<div class="form-grid">'
    +   field("名称", '<input type="text" data-role="c-name" placeholder="如：某品牌无糖酸奶">')
    +   field("分类", '<select data-role="c-cat">' + CATS.map(c => '<option value="' + c + '"'
          + (c === "调味其他" ? ' selected' : '') + '>' + c + '</option>').join("") + '</select>')
    +   field("热量 kcal / 100g", '<input type="number" data-role="c-kcal" min="0" step="0.1" value="0">')
    +   field("蛋白质 g / 100g", '<input type="number" data-role="c-p" min="0" step="0.1" value="0">')
    +   field("脂肪 g / 100g", '<input type="number" data-role="c-f" min="0" step="0.1" value="0">')
    +   field("碳水 g / 100g", '<input type="number" data-role="c-c" min="0" step="0.1" value="0">')
    +   field("膳食纤维 g / 100g", '<input type="number" data-role="c-fiber" min="0" step="0.1" value="0">')
    +   field("水分 g / 100g", '<input type="number" data-role="c-water" min="0" step="0.1" value="0">')
    + '</div>'
    + '<div style="margin-top:12px">'
    +   field("份量提示（可选）", '<input type="text" data-role="c-hint" placeholder="如：1 杯约 200g">')
    + '</div>';
  openModal("新增自定义食材", body,
    '<button class="btn" data-action="custom-save">保存</button>');
}

/* ==========================================================================
   7. 交互
   ========================================================================== */
function switchTab(t){
  state.tab = t;
  state.dishSortOpen = false;      /* 切页时收起排序下拉，避免残留展开态 */
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + t));
  render();
}
function render(){
  if(state.tab === "today")      renderToday();
  else if(state.tab === "reco")  renderReco();
  else if(state.tab === "diy")   renderDiy();
  else if(state.tab === "trend") renderTrend();
  else                           renderMe();
}
function goDate(k){ state.date = k; state.logs = loadLogs(k); render(); }

function onAction(act, el){
  switch(act){
    case "go-me":    switchTab("me"); break;
    case "go-today": switchTab("today"); break;
    case "go-reco":  switchTab("reco"); break;
    case "go-diy":   switchTab("diy"); break;

    case "day-prev":  goDate(shiftKey(state.date, -1)); break;
    case "day-next":  goDate(shiftKey(state.date, 1)); break;
    case "day-today": goDate(todayKey()); break;

    case "open-record": openRecordModal(el.dataset.meal || defaultMeal()); break;
    case "open-record-recipe": openRecipeModal(); break;

    case "del-log":
      state.logs = state.logs.filter(x => x.id !== el.dataset.id);
      saveLogs(); render(); toast("已删除该条记录");
      break;

    /* ---- 删除前的二次确认 ---- */
    case "ask-del-log": {
      const e = state.logs.find(x => x.id === el.dataset.id);
      if(!e){ toast("这条记录已经不在了"); break; }
      const unit = e.src === "water" ? " mL" : "g";
      askConfirm({
        title: '删除这条记录？',
        msg: '将删除「' + esc(e.label) + (e.grams ? ' ' + e.grams + unit : '') + '」（'
           + MEAL_NAME[e.meal] + '）。这笔营养会从 ' + keyLabel(state.date) + ' 的摄入里一并扣掉，删除后无法恢复。',
        action: 'del-log', data: { id: e.id }
      });
      break;
    }
    case "ask-basket-del": {
      const it = state.basket[+el.dataset.i];
      if(!it){ toast("这项已经不在了"); break; }
      askConfirm({
        title: '从本餐移出？',
        msg: '将把「' + esc(it.food.name) + ' ' + it.g + 'g」移出本餐清单。'
           + '只是从搭配里去掉，不会影响已经记录到今日的饮食。',
        btn: '移出', action: 'basket-del', data: { i: String(el.dataset.i) }
      });
      break;
    }
    case "ask-basket-clear": {
      if(!state.basket.length) break;
      const names = state.basket.map(x => x.food.name).slice(0, 6).join('、');
      askConfirm({
        title: '清空本餐搭配？',
        msg: '将清空这餐选中的 ' + state.basket.length + ' 样食材（' + esc(names)
           + (state.basket.length > 6 ? ' 等' : '') + '）。不会影响已经记录到今日的饮食。',
        btn: '清空', action: 'basket-clear', data: {}
      });
      break;
    }
    case "ask-del-custom": {
      const f = state.customFoods.find(x => x.id === el.dataset.fid);
      if(!f){ toast("这个自定义食材已经不在了"); break; }
      askConfirm({
        title: '删除自定义食材？',
        msg: '将删除「' + esc(f.name) + '」，它会从食材库里一并消失，之后不能再选用。'
           + '已经记录到今日的饮食不受影响。',
        action: 'del-custom', data: { fid: f.id }
      });
      break;
    }
    case "confirm-yes": {
      const c = state._confirm;
      if(!c){ closeModal(); break; }
      state._confirm = null;
      closeModal();
      onAction(c.action, { dataset: c.data });
      break;
    }

    case "add-plan": {
      const gap = state._recoGap || currentGap();
      /* 先从推荐列表里找（这样能拿到推荐档位下的 α）；
         搜索出来的菜可能不在推荐档位内，用 buildPlan 兜住。 */
      const list = recommendRecipes(gap, {
        lo: state._recoLo || 0.5, hi: state._recoHi || 2.5, limit: 400
      });
      let p = list.find(x => x.rcp.id === el.dataset.recipe);
      if(!p){
        const rcp = RECIPES.find(r => r.id === el.dataset.recipe);
        if(rcp) p = buildPlan(rcp, gap, 0.5, 2.5);
      }
      if(!p){ toast("缺口已变化，请重新查看推荐"); break; }
      openPlanModal(p, defaultMeal());
      break;
    }
    case "dish-search-clear":
      state.dishQuery = "";
      render();
      break;

    /* ---- 菜品排序 ---- */
    case "dish-sort-toggle":
      state.dishSortOpen = !state.dishSortOpen;
      refreshRecoDishList();
      break;
    case "dish-sort-pick": {
      const k = el.dataset.k;
      const cur = state.dishSort;
      /* 点同一项 = 反转方向；点新项 = 用该字段的默认方向 */
      state.dishSort = (cur && cur.key === k)
        ? { key:k, dir:(cur.dir === "asc" ? "desc" : "asc") }
        : defaultDishSort(k);
      if(!state.dishSort) state.dishSort = { key:k, dir:"desc" };
      state.dishSortOpen = false;
      refreshRecoDishList();
      const d = dishSortDef(state.dishSort.key);
      toast("已按「" + (d ? d[1] : k) + "」"
        + (state.dishSort.dir === "asc" ? "由低到高" : "由高到低") + "排序");
      break;
    }
    case "dish-sort-clear":
      state.dishSort = null;
      state.dishSortOpen = false;
      refreshRecoDishList();
      toast("已恢复按匹配度排序");
      break;
    case "pick-plan-meal": {
      if(!state._planModal) break;
      state._planModal.meal = el.dataset.v;
      const seg = document.getElementById("plan-meals");
      if(seg && seg.children) Array.prototype.forEach.call(seg.children, function(b){
        if(b.classList) b.classList.toggle("on", b.dataset && b.dataset.v === el.dataset.v);
      });
      break;
    }
    case "plan-use-reco": {
      const pm = state._planModal; if(!pm) break;
      state.logs.push(planToEntry(pm.plan, pm.meal));
      const g = Math.max(1, Math.round(pm.plan.grams));
      saveLogs(); closeModal();
      toast(pm.plan.rcp.name + ' 已按推荐 ' + g + 'g 加入' + MEAL_NAME[pm.meal]);
      render();
      break;
    }
    case "plan-confirm": {
      const pm = state._planModal; if(!pm) break;
      const input = document.querySelector('[data-role="plan-g"]');
      const g = Math.round(numOr(input ? input.value : "", 0));
      if(!(g >= 1) || g > 20000){ toast("请填写 1～20000 之间的克数"); break; }
      const k = pm.plan.grams > 0 ? g / pm.plan.grams : 1;
      state.logs.push(planToEntry(pm.plan, pm.meal, k));
      saveLogs(); closeModal();
      toast(pm.plan.rcp.name + ' ' + g + 'g 已加入' + MEAL_NAME[pm.meal]);
      render();
      break;
    }
    case "reco-anyway": state.recoBalanced = true; render(); break;

    case "diy-cat": state.diyCat = el.dataset.cat; render(); break;

    case "add-food": {
      const f = FOOD_MAP[el.dataset.fid];
      if(!f) break;
      const g = roundG(numOr(el.dataset.g, 100));
      const ex = state.basket.find(x => x.food.id === f.id);
      if(ex) ex.g = roundG(ex.g + g);
      else state.basket.push({ food: f, g: g });
      render();
      toast(f.name + ' ' + g + 'g 已加入本餐');
      break;
    }
    case "basket-del":
      state.basket.splice(+el.dataset.i, 1); render(); break;
    case "diy-dish": {
      const rcp = RECIPES.find(r => r.id === el.dataset.rid);
      if(!rcp){ toast("没找到这道菜谱"); break; }
      const have = {};
      state.basket.forEach(it => { have[it.food.id] = 1; });
      const miss = rcp.ings.filter(x => !have[x.fid] && FOOD_MAP[x.fid]);
      if(!miss.length){ toast('「' + rcp.name + '」的食材都已经在本餐清单里了'); break; }
      miss.forEach(x => state.basket.push({ food: FOOD_MAP[x.fid], g: roundG(x.g) }));
      const skipped = rcp.ings.length - miss.length;
      render();
      toast('已把「' + rcp.name + '」的 ' + miss.length + ' 样食材补进本餐'
        + (skipped ? '（' + skipped + ' 样沿用你已选的克数）' : ''));
      break;
    }
    case "basket-clear":
      state.basket = []; render(); toast("已清空本餐搭配"); break;
    case "basket-commit": {
      if(!state.basket.length) break;
      const sel = document.querySelector('[data-role="basket-meal"]');
      const meal = sel ? sel.value : defaultMeal();
      state.basket.forEach(it => state.logs.push(foodToEntry(it.food, it.g, meal)));
      saveLogs();
      state.basket = [];
      toast('已记录到' + MEAL_NAME[meal] + ' · ' + keyLabel(state.date));
      render();
      break;
    }

    case "set-sex":
      state.profile.sex = el.dataset.v; saveProfile(); render(); break;
    case "set-goal":
      state.profile.goal = el.dataset.v; saveProfile(); render(); break;
    case "reset-profile":
      state.profile = defaultProfile(); saveProfile(); render(); toast("已恢复默认身体数据");
      break;
    case "override-clear":
      state.profile.override = { kcal:null, p:null, f:null, c:null, fiber:null, water:null };
      saveProfile(); render(); toast("已回到自动计算的目标");
      break;

    /* ---- 饮水 ---- */
    case "water-add": {
      const ml = Math.max(1, Math.round(numOr(el.dataset.ml, 250)));
      state.logs.push(waterToEntry(ml, "drink"));
      saveLogs(); render();
      toast('已记录饮水 ' + ml + ' mL');
      break;
    }
    case "water-custom": {
      const inp = document.querySelector('[data-role="water-ml"]');
      const ml = Math.round(numOr(inp && inp.value, 0));
      if(!(ml > 0)){ toast("请先填写毫升数"); if(inp) inp.focus(); break; }
      state.logs.push(waterToEntry(ml, "drink"));
      saveLogs(); render();
      toast('已记录饮水 ' + ml + ' mL');
      break;
    }

    /* ---- 主题 ---- */
    case "set-theme":
      state.theme = el.dataset.v; saveTheme(); render();
      toast(state.theme === "auto" ? "已跟随系统配色" : (state.theme === "dark" ? "已切换到深色" : "已切换到浅色"));
      break;

    /* ---- 备份 ---- */
    case "export-backup": downloadBackup(); break;
    case "import-pick": {
      const input = document.querySelector('[data-role="import-file"]');
      const file = input && input.files && input.files[0];
      if(!file){ toast("请先选择一个备份文件"); break; }
      if(typeof FileReader === "undefined"){ toast("当前环境不支持读取文件"); break; }
      const mode = el.dataset.mode || "merge";
      const fr = new FileReader();
      fr.onload = function(){
        let obj = null;
        try{ obj = JSON.parse(String(fr.result)); }
        catch(e){ toast("文件不是合法的 JSON"); return; }
        state._pendingImport = obj;
        askConfirm({
          title: mode === "replace" ? "导入并覆盖现有数据？" : "导入并合并？",
          msg: (mode === "replace"
                 ? "将用备份文件<b>覆盖</b>现有的每日记录、档案、自定义食材与菜谱。"
                 : "将把备份里的记录<b>追加</b>进来，重复的记录会自动跳过，现有数据保留。")
             + "备份导出时间：" + esc(String(obj.exportedAt || "未知")).slice(0, 10) + "。",
          btn: "开始导入", action: "import-apply", data: { mode: mode }
        });
      };
      fr.readAsText(file);
      break;
    }
    case "import-apply": {
      const obj = state._pendingImport;
      if(!obj){ toast("没有待导入的数据"); break; }
      const r = applyBackup(obj, el.dataset.mode || "merge");
      state._pendingImport = null;
      closeModal();
      render();
      toast(r.msg);
      break;
    }

    /* ---- 体重 ---- */
    case "weight-save": {
      const input = document.querySelector('[data-role="weight-in"]');
      const v = numOr(input ? input.value : "", 0);
      if(!(v >= 20) || v > 400){ toast("请填写 20～400 kg 之间的体重"); break; }
      state.weights[state.date] = Math.round(v * 10) / 10;
      saveWeights();
      if(state.profile && Math.abs(state.profile.weight - v) > 0.05){
        state.profile.weight = Math.round(v * 10) / 10;   /* 同步档案里的体重，目标随之更新 */
        saveProfile();
      }
      render();
      toast("已记录 " + keyLabel(state.date) + " 体重 " + state.weights[state.date] + " kg");
      break;
    }
    case "ask-weight-del": {
      if(state.weights[state.date] == null) break;
      askConfirm({
        title: "删除这天的体重记录？",
        msg: "将删除 " + keyLabel(state.date) + " 的体重记录 " + state.weights[state.date]
           + " kg。档案里用于计算目标的体重不会变。",
        action: "weight-del", data: {}
      });
      break;
    }
    case "weight-del":
      delete state.weights[state.date];
      saveWeights(); render(); toast("已删除该天体重记录");
      break;

    /* ---- 饮食模板 ---- */
    case "tmpl-save": {
      if(!state.basket.length){ toast("本餐清单是空的，先选几样食材"); break; }
      openModal("存为常用套餐",
        '<div class="field"><label>套餐名称</label>'
        + '<input type="text" data-role="tmpl-name" placeholder="例如：我的早餐 / 训练后加餐" value=""></div>'
        + '<div class="small muted" style="margin-top:8px">将保存这份搭配（'
        + state.basket.length + ' 样食材，约 ' + Math.round(state.basket.reduce((s, x) => s + x.g, 0))
        + 'g），下次在「自由搭配」里一键套用。</div>',
        '<button class="btn" data-action="tmpl-save-do">保存套餐</button>');
      break;
    }
    case "tmpl-save-do": {
      const inp = document.querySelector('[data-role="tmpl-name"]');
      const name = String(inp ? inp.value : "").trim();
      if(!name){ toast("请填写套餐名称"); break; }
      state.templates.push({
        id: "tpl_" + uid(), name: name,
        items: state.basket.map(x => ({ fid: x.food.id, g: x.g }))
      });
      saveTemplates(); closeModal(); render();
      toast('已保存套餐「' + name + '」');
      break;
    }
    case "tmpl-apply": {
      const t = state.templates.find(x => x.id === el.dataset.id);
      if(!t) break;
      let n = 0;
      t.items.forEach(it => {
        const f = FOOD_MAP[it.fid];
        if(!f) return;
        const ex = state.basket.find(x => x.food.id === f.id);
        if(ex) ex.g = roundG(ex.g + it.g); else state.basket.push({ food: f, g: roundG(it.g) });
        n++;
      });
      render();
      toast(n ? ('已套用套餐「' + t.name + '」，共 ' + n + ' 样食材') : "这个套餐里的食材都不存在了");
      break;
    }
    case "ask-tmpl-del": {
      const t = state.templates.find(x => x.id === el.dataset.id);
      if(!t) break;
      askConfirm({
        title: "删除这个套餐？",
        msg: '将删除「' + esc(t.name) + '」（' + t.items.length + ' 样食材）。已经记录到今日的饮食不受影响。',
        action: "tmpl-del", data: { id: t.id }
      });
      break;
    }
    case "tmpl-del":
      state.templates = state.templates.filter(x => x.id !== el.dataset.id);
      saveTemplates(); render(); toast("已删除该套餐");
      break;

    /* ---- 自定义菜谱 ---- */
    case "open-recipe-custom": openRecipeCustomModal(); break;
    case "rcp-ing-add": {
      const d = state._rcpDraft;
      if(!d) break;
      const f = FOOD_MAP[el.dataset.fid];
      if(!f) break;
      const ex = d.ings.find(x => x.fid === f.id);
      if(ex) ex.g = roundG(ex.g + 100); else d.ings.push({ fid: f.id, g: 100 });
      renderRecipeCustomModal();
      break;
    }
    case "rcp-ing-del": {
      const d = state._rcpDraft;
      if(!d) break;
      d.ings.splice(+el.dataset.i, 1);
      renderRecipeCustomModal();
      break;
    }
    case "rcp-save": {
      const d = state._rcpDraft;
      if(!d) break;
      const box = document.getElementById("modal-box");
      const q = s => { const e = box.querySelector('[data-role="' + s + '"]'); return e ? e.value : ""; };
      const name = String(q("rc-name")).trim();
      if(!name){ toast("请填写菜谱名称"); break; }
      if(!d.ings.length){ toast("至少加一样食材"); break; }
      const note = String(q("rc-note")).trim();
      state.customRecipes.push({
        id: "cr_" + uid(), name: name, cat: q("rc-cat") || "我的菜谱",
        tags: [], note: note, ings: d.ings.map(x => ({ fid:x.fid, g:Math.max(1, Math.round(x.g)) }))
      });
      saveCustomRecipes();
      state._rcpDraft = null;
      closeModal(); render();
      toast('已添加菜谱「' + name + '」，可以搜到它了');
      break;
    }
    case "ask-rcp-del": {
      const r = state.customRecipes.find(x => x.id === el.dataset.id);
      if(!r) break;
      askConfirm({
        title: "删除这个自定义菜谱？",
        msg: '将删除「' + esc(r.name) + '」（' + r.ings.length + ' 样食材）。已经记录到今日的饮食不受影响。',
        action: "rcp-del", data: { id: r.id }
      });
      break;
    }
    case "rcp-del":
      state.customRecipes = state.customRecipes.filter(x => x.id !== el.dataset.id);
      saveCustomRecipes(); render(); toast("已删除该自定义菜谱");
      break;

    /* ---- 复制上一餐 / 昨天 ---- */
    case "open-copy": openCopyModal(); break;
    case "copy-meal": {
      const src = LS.get(K.LOG + el.dataset.date, []) || [];
      const list = src.filter(e => e.meal === el.dataset.meal);
      if(!list.length){ toast("那天这一餐没有记录"); break; }
      copyEntriesTo(list, el.dataset.meal);
      closeModal(); render();
      toast('已把 ' + keyLabel(el.dataset.date) + ' 的' + MEAL_NAME[el.dataset.meal]
        + '（' + list.length + ' 条）复制到今天');
      break;
    }
    case "copy-day": {
      const src = LS.get(K.LOG + el.dataset.date, []) || [];
      if(!src.length){ toast("那天没有记录"); break; }
      copyEntriesTo(src, null);
      closeModal(); render();
      toast('已把 ' + keyLabel(el.dataset.date) + ' 的 ' + src.length + ' 条记录复制到今天');
      break;
    }

    /* ---- 趋势范围 ---- */
    case "trend-days": state.trendDays = +el.dataset.d || 7; render(); break;
    case "cal-month":
      state.calMonth = el.dataset.v === "this" ? ""
        : calShiftMonth(state.calMonth || calMonthKey(todayKey()), el.dataset.v === "prev" ? -1 : 1);
      render();
      break;
    case "day-goto": goDate(el.dataset.date); switchTab("today"); break;

    case "open-custom": openCustomModal(); break;
    case "del-custom": {
      state.customFoods = state.customFoods.filter(f => f.id !== el.dataset.fid);
      saveCustom(); registerCustomFoods(state.customFoods); render(); toast("已删除该自定义食材");
      break;
    }
    case "custom-save": {
      const box = document.getElementById("modal-box");
      const q = s => { const e = box.querySelector('[data-role="' + s + '"]'); return e ? e.value : ""; };
      const name = String(q("c-name")).trim();
      if(!name){ toast("请填写食材名称"); return; }
      const kcal = numOr(q("c-kcal"), 0), p = numOr(q("c-p"), 0),
            f = numOr(q("c-f"), 0), c = numOr(q("c-c"), 0),
            fiber = numOr(q("c-fiber"), 0), water = numOr(q("c-water"), 0);
      if(kcal <= 0 && p <= 0 && f <= 0 && c <= 0){ toast("至少要填一项营养值"); return; }
      state.customFoods.push({
        id:"cf_" + uid(), name:name, cat:q("c-cat") || "调味其他",
        kcal:kcal, p:p, f:f, c:c, fiber:fiber, water:water,
        hint:String(q("c-hint")).trim(), custom:true
      });
      saveCustom();
      registerCustomFoods(state.customFoods);
      closeModal(); render(); toast("已添加：" + name);
      break;
    }

    case "pick-meal":
      state._recMeal = el.dataset.v;
      el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el));
      break;
    case "rec-add": {
      const f = FOOD_MAP[el.dataset.fid];
      if(!f) break;
      const inp = el.parentElement.querySelector('[data-role="rec-g"]');
      const sel = el.parentElement.querySelector('[data-role="rec-unit"]');
      /* 家常单位：「个 / 碗 / 勺」等，select 的值 = 每单位对应克数，克为 1 */
      const mult = sel ? numOr(sel.value, 1) : 1;
      const cnt = numOr(inp && inp.value, 0);
      const g = roundG(cnt * mult);
      if(!(g > 0)){ toast(mult === 1 ? "请先填写克数" : "请先填写数量"); if(inp) inp.focus(); break; }
      state.logs.push(foodToEntry(f, g, state._recMeal || defaultMeal()));
      saveLogs(); closeModal(); render();
      toast(f.name + ' ' + g + 'g 已记录'
        + (mult === 1 ? '' : '（' + cnt + ' × ' + mult + 'g）'));
      break;
    }
    case "rec-recipe": {
      const r = RECIPES.find(x => x.id === el.dataset.rid);
      if(!r) break;
      const V = recipeVector(r);
      state.logs.push({
        id: uid(), meal: state._recMeal || defaultMeal(), src:"recipe", refId:r.id,
        label: r.name, grams: recipeTotalGrams(r),
        items: r.ings.map(it => ({ name:(FOOD_MAP[it.fid] || {}).name || it.fid, g:it.g })),
        kcal: round1(V.kcal), p: round1(V.p), f: round1(V.f), c: round1(V.c),
        fiber: round1(V.fiber || 0), water: round1(V.water || 0), ts: Date.now()
      });
      saveLogs(); closeModal(); render();
      toast(r.name + ' 已记录');
      break;
    }
    case "modal-close": closeModal(); break;
  }
}

document.addEventListener("click", function(ev){
  /* 排序下拉：点到控件外面就收起（点控件自身交给下面的 action 处理） */
  let closedSort = false;
  if(state.dishSortOpen && !(ev.target.closest && ev.target.closest(".dish-sort"))){
    state.dishSortOpen = false;
    closedSort = true;
  }
  const el = ev.target.closest("[data-action]");
  if(!el){
    if(closedSort) refreshRecoDishList();
    return;
  }
  ev.preventDefault();
  onAction(el.dataset.action, el);
});
document.addEventListener("input", function(ev){
  const el = ev.target;
  const role = el.dataset ? el.dataset.role : null;
  if(role === "diy-search"){
    state.diyQuery = el.value;
    refreshDiyFoodList();
  }else if(role === "rec-search"){
    const box = document.getElementById("rec-list");
    if(box) box.innerHTML = recModalList(el.value);
  }else if(role === "plan-g"){
    planPreviewUpdate();
  }else if(role === "dish-search"){
    state.dishQuery = el.value;
    refreshRecoDishList();
  }
});
document.addEventListener("change", function(ev){
  const el = ev.target;
  const role = el.dataset ? el.dataset.role : null;
  if(!role) return;
  if(role === "f-age" || role === "f-height" || role === "f-weight"){
    const key = role.slice(2);
    state.profile[key] = numOr(el.value, state.profile[key]);
    saveProfile(); render();
  }else if(role === "f-activity"){
    state.profile.activity = numOr(el.value, 1.375);
    saveProfile(); render();
  }else if(role.indexOf("ov-") === 0){
    const k = role.slice(3);
    const v = String(el.value).trim();
    state.profile.override[k] = v === "" ? null : numOr(v, null);
    saveProfile(); render();
  }else if(role === "theme-sel"){
    state.theme = el.value === "dark" ? "dark" : (el.value === "light" ? "light" : "auto");
    saveTheme();
    toast(state.theme === "auto" ? "已跟随系统配色" : (state.theme === "dark" ? "已切换到深色" : "已切换到浅色"));
  }else if(role === "basket-g"){
    const i = +el.dataset.i;
    if(state.basket[i]){
      state.basket[i].g = roundG(numOr(el.value, state.basket[i].g));
      render();
    }
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape"){
    /* 排序下拉优先于弹窗：先收下拉，再收弹窗 */
    if(state.dishSortOpen){ state.dishSortOpen = false; refreshRecoDishList(); return; }
    closeModal();
    return;
  }
  const role = ev.target && ev.target.dataset ? ev.target.dataset.role : null;
  if(ev.key === "Enter" && role === "water-ml") onAction("water-custom", ev.target);
  if(ev.key === "Enter" && role === "plan-g") onAction("plan-confirm", ev.target);
});
document.getElementById("modal").addEventListener("click", function(ev){
  if(ev.target === this) closeModal();
});

/* ==========================================================================
   8. 启动
   ========================================================================== */
function init(){
  LS.set(K.VER, SCHEMA_VERSION);
  state.profile = loadProfile();
  state.customFoods = loadCustom();
  registerCustomFoods(state.customFoods);
  state.customRecipes = loadCustomRecipes();
  registerCustomRecipes();
  state.weights = loadWeights();
  state.templates = loadTemplates();
  state.theme = LS.get(K.THEME, "auto");
  if(["light", "dark", "auto"].indexOf(state.theme) < 0) state.theme = "auto";
  applyTheme();
  /* 选「跟随系统」时，系统深浅色切换要立刻生效 */
  try{
    const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if(mq && mq.addEventListener) mq.addEventListener("change", applyTheme);
    else if(mq && mq.addListener) mq.addListener(applyTheme);
  }catch(e){}
  state.date = todayKey();
  state.logs = loadLogs(state.date);
  document.getElementById("tabs").addEventListener("click", function(ev){
    const b = ev.target.closest("[data-tab]");
    if(b) switchTab(b.dataset.tab);
  });
  render();
  if(state.profileFresh){
    setTimeout(() => toast("先到「我的目标」填写身体数据，每日目标会更贴合你"), 500);
  }
}
init();
</script>
